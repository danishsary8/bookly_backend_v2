name: Tests

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: read

jobs:
  code-style:
    runs-on: ubuntu-latest
    name: Code style (Pint)

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: 8.3
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check formatting
        run: vendor/bin/pint --test

      - name: Type-check the Railway infrastructure file
        run: |
          npm ci --no-audit --no-fund
          npx -y -p typescript@5 tsc --noEmit --strict --target es2022 --module esnext --moduleResolution bundler --skipLibCheck .railway/railway.ts

  docker:
    runs-on: ubuntu-latest
    name: Docker image (build + smoke test)

    # Same PostgreSQL major version as Railway's database template.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: bookshop
          POSTGRES_DB: bookshop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshop -d bookshop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the image
        run: docker build -t bookly-api .

      - name: Production settings for the smoke test
        run: |
          {
            echo "APP_KEY=base64:$(openssl rand -base64 32)"
            echo "APP_URL=http://localhost:8080"
            echo "DB_CONNECTION=pgsql"
            echo "DB_URL=postgresql://bookshop:bookshop@127.0.0.1:5432/bookshop"
            echo "CACHE_STORE=database"
            echo "QUEUE_CONNECTION=database"
            echo "SESSION_DRIVER=array"
            echo "MAIL_MAILER=log"
          } > smoke.env

      - name: Migrate and seed demo data through the image (production mode)
        run: |
          docker run --rm --network host --env-file smoke.env bookly-api php artisan migrate --force
          docker run --rm --network host --env-file smoke.env -e DEMO_SEED_ALLOWED=true bookly-api php artisan db:seed --class=DemoSeeder --force

      - name: Web role answers
        run: |
          docker run -d --name web --network host --env-file smoke.env -e CONTAINER_ROLE=web bookly-api
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/v1/ping >/dev/null && break; sleep 1; done
          curl -fsS http://localhost:8080/api/v1/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/v1/books | grep -q '"total":20'
          curl -fsS -o /dev/null http://localhost:8080/docs
          curl -fsS -o /dev/null http://localhost:8080/openapi.yaml
          test "$(docker exec web id -un)" = "bookly"
          docker logs web 2>&1 | tail -n 20

      - name: Worker and scheduler roles stay up
        run: |
          for role in worker scheduler; do
            status=0
            timeout 20 docker run --rm --network host --env-file smoke.env -e CONTAINER_ROLE=$role bookly-api || status=$?
            echo "$role exit code: $status (124 = still running when stopped)"
            test "$status" -eq 124
          done

  tests:
    runs-on: ubuntu-latest

    # The schema uses PostgreSQL features (jsonb, tsvector full-text search, CHECK constraints),
    # so tests run against a real PostgreSQL, matching phpunit.xml (database bookshop_v2_test).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: bookshop
          POSTGRES_PASSWORD: bookshop
          POSTGRES_DB: bookshop_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bookshop -d bookshop_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    strategy:
      fail-fast: true
      matrix:
        php: [8.3, 8.4, 8.5]

    name: PHP ${{ matrix.php }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pgsql, pdo_pgsql
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: Execute tests
        run: php artisan test
