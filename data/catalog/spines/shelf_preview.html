
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bookly Top 20 Collectible Book Spines</title>
  <style>
    body {
      background: #F0ECE1;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 28px;
      color: #2C2825;
      margin-bottom: 8px;
      letter-spacing: 0.05em;
    }
    p {
      color: #6E6862;
      margin-bottom: 40px;
      font-size: 15px;
    }
    .shelf-wrapper {
      background: #E5DFD3;
      padding: 40px 30px 0 30px;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.12), inset 0 2px 4px rgba(255,255,255,0.4);
      max-width: 95vw;
      overflow-x: auto;
    }
    .shelf-rack {
      display: flex;
      gap: 6px;
      align-items: flex-end;
      padding-bottom: 0px;
    }
    .spine-item {
      width: 108px;
      height: 640px;
      flex-shrink: 0;
      transition: transform 0.25s cubic-bezier(0.2, 0.8, 0.2, 1), filter 0.25s ease;
      cursor: pointer;
    }
    .spine-item:hover {
      transform: translateY(-24px) scale(1.03);
      filter: drop-shadow(0 16px 20px rgba(0,0,0,0.25));
      z-index: 10;
    }
    .spine-item img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .shelf-base {
      height: 22px;
      background: linear-gradient(180deg, #C2B6A3 0%, #AFA28E 100%);
      border-top: 2px solid #8E8270;
      box-shadow: 0 8px 16px rgba(0,0,0,0.18);
      margin: 0 -30px;
      border-radius: 0 0 12px 12px;
    }
  </style>
</head>
<body>
  <h1>Bookly Collectible Spines — Top 20 Classic Editions</h1>
  <p>Inspired by vintage clothbound &amp; VHS collection bookbinding. Standing in catalog sequence.</p>
  
  <div class="shelf-wrapper">
    <div class="shelf-rack">
      
        <div class="spine-item" title="NO. 01 - PRIDE & PREJUDICE (Jane Austen)">
          <img src="spine_01_pride_and_prejudice.png" alt="PRIDE & PREJUDICE" />
        </div>
      
        <div class="spine-item" title="NO. 02 - 1984 (George Orwell)">
          <img src="spine_02_1984.png" alt="1984" />
        </div>
      
        <div class="spine-item" title="NO. 03 - THE GREAT GATSBY (F. Scott Fitzgerald)">
          <img src="spine_03_the_great_gatsby.png" alt="THE GREAT GATSBY" />
        </div>
      
        <div class="spine-item" title="NO. 04 - TO KILL A MOCKINGBIRD (Harper Lee)">
          <img src="spine_04_to_kill_a_mockingbird.png" alt="TO KILL A MOCKINGBIRD" />
        </div>
      
        <div class="spine-item" title="NO. 05 - DUNE (Frank Herbert)">
          <img src="spine_05_dune.png" alt="DUNE" />
        </div>
      
        <div class="spine-item" title="NO. 06 - THE HOBBIT (J.R.R. Tolkien)">
          <img src="spine_06_the_hobbit.png" alt="THE HOBBIT" />
        </div>
      
        <div class="spine-item" title="NO. 07 - FRANKENSTEIN (Mary Shelley)">
          <img src="spine_07_frankenstein.png" alt="FRANKENSTEIN" />
        </div>
      
        <div class="spine-item" title="NO. 08 - DRACULA (Bram Stoker)">
          <img src="spine_08_dracula.png" alt="DRACULA" />
        </div>
      
        <div class="spine-item" title="NO. 09 - THE PICTURE OF DORIAN GRAY (Oscar Wilde)">
          <img src="spine_09_the_picture_of_dorian_gray.png" alt="THE PICTURE OF DORIAN GRAY" />
        </div>
      
        <div class="spine-item" title="NO. 10 - MEDITATIONS (Marcus Aurelius)">
          <img src="spine_10_meditations.png" alt="MEDITATIONS" />
        </div>
      
        <div class="spine-item" title="NO. 11 - THE ART OF WAR (Sun Tzu)">

        <div class="spine-item" title="NO. 12 - MOBY-DICK (Herman Melville)">

        </div>
      
        <div class="spine-item" title="NO. 15 - THE TIME MACHINE (H. G. Wells)">
          <img src="spine_15_the_time_machine.png" alt="THE TIME MACHINE" />
        </div>
      
        <div class="spine-item" title="NO. 16 - THE WAR OF THE WORLDS (H. G. Wells)">
          <img src="spine_16_the_war_of_the_worlds.png" alt="THE WAR OF THE WORLDS" />
        </div>
      
        <div class="spine-item" title="NO. 17 - TREASURE ISLAND (Robert Louis Stevenson)">
          <img src="spine_17_treasure_island.png" alt="TREASURE ISLAND" />
        </div>
      
        <div class="spine-item" title="NO. 18 - 20,000 LEAGUES UNDER THE SEAS (Jules Verne)">
          <img src="spine_18_twenty_thousand_leagues.png" alt="20,000 LEAGUES UNDER THE SEAS" />
        </div>
      
        <div class="spine-item" title="NO. 19 - AROUND THE WORLD IN 80 DAYS (Jules Verne)">
          <img src="spine_19_around_the_world_in_80_days.png" alt="AROUND THE WORLD IN 80 DAYS" />
        </div>
      
        <div class="spine-item" title="NO. 20 - EMMA (Jane Austen)">
          <img src="spine_20_emma.png" alt="EMMA" />
        </div>
      
    </div>
    <div class="shelf-base"></div>
  </div>
</body>
</html>
