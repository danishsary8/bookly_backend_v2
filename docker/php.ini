; Production PHP settings for the Bookly image.
expose_php = Off
memory_limit = 256M
; Ebook PDFs (staff) can be up to 50 MB; everything else is checked smaller in the app.
upload_max_filesize = 52M
post_max_size = 54M
max_execution_time = 60

opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
