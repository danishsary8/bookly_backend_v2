      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: 'Payment state', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/KhqrPayment' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
