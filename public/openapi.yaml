  /staff/books:
    get: { tags: [Staff catalog], summary: 'All books incl. hidden/deleted (q, status, trashed)', responses: { '200': { description: Books } } }
    post: { tags: [Staff catalog], summary: 'Create a book (title, status, publish_at, publisher_id, series_id, author_ids, category_ids, ...)', responses: { '201': { description: Created } } }
  /staff/books/bulk:
    post: { tags: [Staff catalog], summary: 'Bulk update books (ids, add/remove categories, status, publish_at)', responses: { '200': { description: Updated } } }
  /staff/books/export:
    get: { tags: [Staff catalog], summary: '(admin) Export books and variants as UTF-8 CSV with BOM', responses: { '200': { description: CSV } } }
  /staff/books/export-template:
    get: { tags: [Staff catalog], summary: '(admin) Download CSV import template', responses: { '200': { description: CSV } } }
  /staff/books/import/preview:
    post:
      tags: [Staff catalog]
      summary: '(admin) Preview CSV book import: nothing is written'
      description: 'Same columns as the export (book_id ignored), one row per format; only `sku` is a required column. A row updates the format with the same SKU (any case), else the same ISBN (digits/X compared); otherwise it creates a new book + format (needs title, format, sku, price_usd; new books are drafts unless `status` says otherwise; rows with the same title and authors become one book). Optional audience fields: `age_min`, `age_max` (0–18, max ≥ min), `school_grade` (1–12), `level` (A1–C2). On an update a blank cell keeps the current value. Categories must exist; authors, publisher and series are created. `publish_at` is read in shop time. Max 2 MB and 2000 rows; quoted cells may span lines.'
      requestBody: { content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      preview_token: { type: string }
                      totals: { type: object, properties: { total: { type: integer }, new: { type: integer }, update: { type: integer }, error: { type: integer } } }
                      rows: { type: array, items: { $ref: '#/components/schemas/BookImportRow' } }
  /staff/books/import/confirm:
    post:
      tags: [Staff catalog]
      summary: '(admin) Apply a previewed import'
      description: 'Checks every row again against the catalog as it is now, then applies the valid rows in one transaction (stock changes are logged as adjustments). The token works once, for 30 minutes, for the admin who made it.'
      requestBody: { content: { application/json: { schema: { type: object, required: [preview_token], properties: { preview_token: { type: string } } } } } }
      responses:
        '200':
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      created: { type: integer }
                      updated: { type: integer }
                      skipped: { type: integer }
                      errors: { type: array, items: { $ref: '#/components/schemas/BookImportRow' } }
  /staff/books/{id}:
    get: { tags: [Staff catalog], summary: 'Book with all variants', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Book } } }
    patch: { tags: [Staff catalog], summary: 'Update a book', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated } } }
