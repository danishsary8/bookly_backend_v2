openapi: 3.0.3
info:
  title: Bookly API
  version: "1.0"
  description: |
    REST API for the Bookly bookstore (Laravel 13 + PostgreSQL).

    **Auth.** Log in to get a Bearer token (customers: valid 7 days, staff: 12 hours) and send it as `Authorization: Bearer <token>`.
    Customer tokens only work on customer routes; staff tokens only on `/staff/*` routes, and only after
    two-factor authentication is set up. Admin-only routes are marked **(admin)**.

    **Errors.** `{"message": "..."}`. Validation errors are 422 with `errors: {field: [messages]}`.
    401 = not logged in, 403 = not allowed (wrong account type, email not verified, 2FA not set up,
    deactivated account), 429 = rate limited (see `Retry-After`).

    **Rate limits.** 120 requests/min per user or IP, plus stricter limits on login, codes, coupons,
    checkout and reviews. Every response has an `X-Request-Id` header — quote it when reporting a problem.

    Full field-by-field reference: `docs/API.md` in the repository.
servers:
  - url: /api/v1
tags:
  - { name: Public, description: 'No login needed: catalog, reviews, health' }
  - { name: Customer auth, description: 'Register, verify email, log in, reset password' }
  - { name: Customer, description: 'Profile, addresses, cart, wishlist (verified customers)' }
  - { name: Checkout & orders, description: 'Cash-on-delivery checkout and order history' }
  - { name: Returns & reviews, description: 'Returns for delivered orders and book reviews' }
  - { name: Staff auth, description: 'Staff login with required authenticator-app 2FA' }
  - { name: Staff catalog, description: 'Books, formats, authors, categories, publishers, series' }
  - { name: Staff operations, description: 'Coupons, orders, returns, reviews, customers, alerts' }
  - { name: Admin, description: 'Admin-only: staff, exchange rates, audit log, dashboard, export' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, facebook] }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [today, 7d, 30d, custom], default: 30d }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
  responses:
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Not logged in or token expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed for this account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (also returned for another customer's records)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NoContent:
      description: Done, no body
  schemas:
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Money:
      type: string
      description: Decimal amount with 2 decimals, e.g. "19.99"
      example: "19.99"
    Riel:
      type: string
      nullable: true
      description: Whole riel, null when no USD->KHR rate is set
      example: "81959"
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }
        path: { type: string }
    PageLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    Amount:
      type: object
      description: The same amount in US dollars and in riel (khr is null when no exchange rate is set)
      properties:
        usd: { $ref: '#/components/schemas/Money' }
        khr: { $ref: '#/components/schemas/Riel' }
    Author:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        bio: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
        books_count: { type: integer }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        books_count: { type: integer }
    Publisher:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        books_count: { type: integer }
    Series:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        books_count: { type: integer }
    SeriesDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        books: { type: array, items: { $ref: '#/components/schemas/BookCard' } }
    RatingSummary:
      type: object
      properties:
        average: { type: number, nullable: true }
        count: { type: integer }
        distribution:
          type: object
          description: 'Number of reviews per star, keys "5" to "1"'
          additionalProperties: { type: integer }
    CheckoutPreview:
      type: object
      properties:
        subtotal: { $ref: '#/components/schemas/Amount' }
        discount: { $ref: '#/components/schemas/Amount' }
        shipping_fee: { $ref: '#/components/schemas/Amount' }
        tax: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        coupon_code: { type: string, nullable: true }
        requires_shipping: { type: boolean, description: false when the cart only has ebooks/audiobooks }
        delivery_area: { type: string, enum: [phnom_penh, provinces], nullable: true, description: 'Area the shipping fee was priced for; null when the customer has no address yet (the provinces fee is quoted)' }
        can_checkout: { type: boolean }
    CouponCheck:
      type: object
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { $ref: '#/components/schemas/Money' }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        discount_khr: { $ref: '#/components/schemas/Riel' }
        total_before_shipping_usd: { $ref: '#/components/schemas/Money' }
        total_before_shipping_khr: { $ref: '#/components/schemas/Riel' }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, nullable: true, description: 'Null for Facebook accounts that signed up with a phone number only' }
        phone: { type: string, nullable: true, description: Contact number as shown to people }
        phone_number: { type: string, nullable: true, description: 'Verified number in international form (+85512345678)' }
        phone_verified: { type: boolean }
        email_verified: { type: boolean }
        verified: { type: boolean, description: 'Email or phone proven; only verified customers can shop' }
        has_password: { type: boolean }
        locale: { type: string, enum: [en, km], example: en }
        connected: { type: object, properties: { google: { type: boolean }, facebook: { type: boolean } } }
        sign_in_methods: { type: array, items: { type: string, enum: [password, google, facebook, telegram] }, description: 'Ways this account can sign in today (password counts only with an email; telegram means a verified number, while the Telegram bot is on). The last one cannot be removed.' }
        pending_email: { type: string, nullable: true, description: 'Only on the customer''s own account: an address that was sent a code (Telegram sign-up, change email) and is added once POST /me/email/verify gets that code.' }
        created_at: { type: string, format: date-time }
    BookCard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        language: { type: string }
        publish_date: { type: string, format: date, nullable: true }
        authors: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        cover_image_url: { type: string, nullable: true }
        price_from_usd: { $ref: '#/components/schemas/Money' }
        price_from_khr: { $ref: '#/components/schemas/Riel' }
        formats: { type: array, items: { type: string, enum: [hardcover, paperback, ebook, audiobook] } }
        in_stock: { type: boolean }
        rating_avg: { type: number, nullable: true }
        review_count: { type: integer }
    Variant:
      type: object
      properties:
        id: { type: integer }
        format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
        isbn: { type: string, nullable: true }
        price_usd: { $ref: '#/components/schemas/Money' }
        price_khr: { $ref: '#/components/schemas/Riel' }
        in_stock: { type: boolean }
        cover_image_url: { type: string, nullable: true }
    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookCard'
        - type: object
          properties:
            description: { type: string, nullable: true }
            page_count: { type: integer, nullable: true }
            categories: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, slug: { type: string } } } }
            publisher: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
            series: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string }, order: { type: integer, nullable: true } } }
            variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
    Address:
      type: object
      properties:
        id: { type: integer }
        label: { type: string, nullable: true }
        recipient_name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country: { type: string }
        is_default: { type: boolean }
    AddressInput:
      type: object
      required: [recipient_name, phone, address_line1, city, country]
      properties:
        label: { type: string }
        recipient_name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string }
        is_default: { type: boolean }
    CartIssue:
      type: object
      properties:
        code: { type: string, enum: [unavailable, out_of_stock, insufficient_stock, price_changed] }
        message: { type: string }
        available_quantity: { type: integer }
        previous_price_usd: { $ref: '#/components/schemas/Money' }
    Cart:
      type: object
      properties:
        id: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              book_variant_id: { type: integer }
              book: { type: object, properties: { id: { type: integer }, title: { type: string } } }
              format: { type: string }
              cover_image_url: { type: string, nullable: true }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              unit_price_khr: { $ref: '#/components/schemas/Riel' }
              line_total_usd: { $ref: '#/components/schemas/Money' }
              line_total_khr: { $ref: '#/components/schemas/Riel' }
              issues: { type: array, items: { $ref: '#/components/schemas/CartIssue' } }
        item_count: { type: integer }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_khr: { $ref: '#/components/schemas/Riel' }
        can_checkout: { type: boolean }
    Order:
      type: object
      properties:
        id: { type: integer }
        order_number: { type: string, example: ORD-20261003-7K2QX }
        status: { type: string, enum: [pending, paid, processing, shipped, delivered, cancelled, returned] }
        payment_method: { type: string, enum: [card, cod, khqr] }
        payment_status: { type: string, enum: [pending, succeeded, failed, refunded] }
        placed_at: { type: string, format: date-time }
        item_count: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              book_variant_id: { type: integer }
              book_id: { type: integer }
              title: { type: string }
              format: { type: string }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        shipping_fee_usd: { $ref: '#/components/schemas/Money' }
        tax_usd: { $ref: '#/components/schemas/Money' }
        total_usd: { $ref: '#/components/schemas/Money' }
        total_khr: { $ref: '#/components/schemas/Riel' }
        coupon_code: { type: string, nullable: true }
        shipping_address: { $ref: '#/components/schemas/AddressInput' }
        can_cancel: { type: boolean }
        delivery_note: { type: string, maxLength: 300, nullable: true }
        status_history:
          type: array
          items: { type: object, properties: { status: { type: string }, note: { type: string, nullable: true }, created_at: { type: string, format: date-time } } }
    OrderDocument:
      type: object
      description: 'What an invoice or packing slip prints. KHR uses the rate in force when the order was placed (null when no rate was set then), so a reprint never changes.'
      properties:
        id: { type: integer }
        order_number: { type: string, example: ORD-20261003-7K2QX }
        status: { type: string, enum: [pending, paid, processing, shipped, delivered, cancelled, returned] }
        placed_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        delivery_note: { type: string, maxLength: 300, nullable: true }
        payment_method: { type: string, enum: [card, cod, khqr] }
        payment_status: { type: string, enum: [pending, succeeded, failed, refunded], nullable: true }
        customer: { type: object, properties: { name: { type: string }, email: { type: string, nullable: true }, phone: { type: string, nullable: true } } }
        shipping_address: { $ref: '#/components/schemas/AddressInput' }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              authors: { type: array, items: { type: string } }
              format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
              is_digital: { type: boolean }
              sku: { type: string }
              isbn: { type: string, nullable: true }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        coupon_code: { type: string, nullable: true }
        shipping_fee_usd: { $ref: '#/components/schemas/Money' }
        tax_usd: { $ref: '#/components/schemas/Money' }
        total_usd: { $ref: '#/components/schemas/Money' }
        refunded_usd: { $ref: '#/components/schemas/Money' }
        amount_to_collect_usd: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'What the courier collects: the total for an unpaid cash-on-delivery order, else 0.00' }
        khr:
          type: object
          nullable: true
          properties:
            rate: { type: string, example: '4100.000000' }
            rate_effective_at: { type: string, format: date-time }
            total: { $ref: '#/components/schemas/Riel' }
            amount_to_collect: { $ref: '#/components/schemas/Riel' }
    Return:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [requested, approved, rejected, refunded] }
        reason: { type: string }
        items:
          type: array
          items: { type: object, properties: { id: { type: integer }, order_item_id: { type: integer }, title: { type: string }, format: { type: string }, quantity: { type: integer }, unit_price_usd: { $ref: '#/components/schemas/Money' }, reason: { type: string, nullable: true } } }
        refund_amount_usd: { $ref: '#/components/schemas/Money' }
        is_refund_final: { type: boolean, description: false while the amount is an estimate }
        refund_method: { type: string, nullable: true, enum: [store_credit, manual_offline] }
        refund_reference: { type: string, nullable: true }
        refunded_at: { type: string, format: date-time, nullable: true }
        staff_note: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        can_withdraw: { type: boolean }
    Review:
      type: object
      properties:
        id: { type: integer }
        book_id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        reviewer_name: { type: string, example: Sok D. }
        verified_purchase: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OwnReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            book: { type: object, properties: { id: { type: integer }, title: { type: string } } }
            is_visible: { type: boolean, description: false when staff have hidden the review }

    StockAlert:
      type: object
      properties:
        id: { type: integer }
        book_variant_id: { type: integer }
        created_at: { type: string, format: date-time }
        notified_at: { type: string, format: date-time, nullable: true }
        book:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            title: { type: string }
            cover_image_url: { type: string, nullable: true }
        variant:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            format: { type: string }
            price_usd: { type: string }
            stock_quantity: { type: integer }
            is_active: { type: boolean }

security:
  - bearer: []

paths:
  /ping:
    get: { tags: [Public], summary: 'Liveness check', security: [], responses: { '200': { description: '{"status":"ok","version":"v1"}' } } }
  /health:
    get:
      tags: [Public]
      summary: Database, queue and Telegram bot health for uptime monitors
      security: []
      description: 'Includes checks.telegram_bot: off without a bot token; otherwise getWebhookInfo is cached for 10 minutes, including failures. Status is ok when the webhook URL matches this request''s API address (HTTPS in production) and no delivery error is dated within the last 30 minutes. Otherwise degraded with error: Telegram delivery message (token redacted), webhook not set, or Telegram unreachable. A degraded queue or bot makes overall status degraded; HTTP stays 200. Database down keeps the existing 503 response.'
      responses:
        '200': { description: 'status ok or degraded (queue jobs waiting > 10 min or Telegram bot degraded); checks include database, queue and telegram_bot' }
        '503': { description: Database unreachable }
  /telegram/webhook:
    post:
      tags: [Public]
      summary: Updates for the Bookly Telegram bot (called by Telegram only)
      security: []
      description: 'Telegram posts each message for the bot here, with the X-Telegram-Bot-Api-Secret-Token header set by `php artisan telegram:webhook` (made from APP_KEY and the bot token). "/start <code>" answers with a "Share my phone number" button; the shared contact (only the sender''s own: contact.user_id = from.id, +855 only) signs in or saves the number. Replies are a sendMessage call in the response body. 404 without the right header or while the bot is off.'
      responses: { '200': { description: 'A sendMessage call for Telegram to run' }, '204': { description: 'Nothing to answer (not a private chat)' }, '404': { description: 'Wrong secret, or the bot is off' } }

  /books:
    get:
      tags: [Public]
      summary: List, search, filter and sort books
      security: []
      parameters:
        - { name: q, in: query, description: 'Search as you type: every word must match the title, description, an author, the series or a category name; words match as prefixes', schema: { type: string } }
        - { name: category_id, in: query, schema: { type: integer } }
        - { name: author_id, in: query, schema: { type: integer } }
        - { name: series_id, in: query, schema: { type: integer } }
        - { name: publisher_id, in: query, schema: { type: integer } }
        - { name: format, in: query, schema: { type: string, enum: [hardcover, paperback, ebook, audiobook] } }
        - { name: language, in: query, schema: { type: string } }
        - { name: min_price, in: query, schema: { type: number } }
        - { name: max_price, in: query, schema: { type: number } }
        - { name: in_stock, in: query, schema: { type: boolean } }
        - { name: sort, in: query, schema: { type: string, enum: [relevance, newest, price_asc, price_desc, title, rating] } }
        - { name: ids, in: query, description: 'Comma-separated IDs or array (max 12); keeps order and drops missing/hidden books', schema: { type: string } }
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated book cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BookCard' } }
                  links: { $ref: '#/components/schemas/PageLinks' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
        '422': { $ref: '#/components/responses/Validation' }
  /books/{id}:
    get:
      tags: [Public]
      summary: Book detail with active formats
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Book, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/BookDetail' } } } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{id}/also-bought:
    get:
      tags: [Public]
      summary: Up to 6 recommended books bought together with this book, fallback to category best sellers
      security: []
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200':
          description: Recommended book cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/BookCard' } }
        '404': { $ref: '#/components/responses/NotFound' }
  /books/{id}/reviews:
    get:
      tags: [Public]
      summary: Visible reviews with rating summary (average, count, 1-5 distribution in meta.rating_summary)
      security: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - { name: sort, in: query, schema: { type: string, enum: [newest, highest, lowest] } }
        - { name: rating, in: query, schema: { type: integer, minimum: 1, maximum: 5 } }
      responses:
        '200': { description: Reviews, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Review' } }, meta: { allOf: [ { $ref: '#/components/schemas/PageMeta' }, { type: object, properties: { rating_summary: { $ref: '#/components/schemas/RatingSummary' } } } ] } } } } } }
    post:
      tags: [Returns & reviews]
      summary: Review a book from one of your delivered orders
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rating], properties: { rating: { type: integer, minimum: 1, maximum: 5 }, comment: { type: string } } } } } }
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '201': { description: Created }
        '403': { description: No delivered order contains this book }
        '409': { description: Already reviewed }
  /authors:
    get: { tags: [Public], summary: 'List authors (q, per_page)', security: [], responses: { '200': { description: Authors with books_count, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Author' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /authors/{id}:
    get: { tags: [Public], summary: 'Author profile (books via /books?author_id=)', security: [], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Author, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Author' } } } } } }, '404': { $ref: '#/components/responses/NotFound' } } }
  /categories:
    get: { tags: [Public], summary: 'All categories with books_count (not paginated)', security: [], responses: { '200': { description: Categories, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Category' } } } } } } } } }
  /publishers:
    get: { tags: [Public], summary: 'List publishers', security: [], responses: { '200': { description: Publishers, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Publisher' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /series:
    get: { tags: [Public], summary: 'List series', security: [], responses: { '200': { description: Series, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Series' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /series/{id}:
    get: { tags: [Public], summary: 'Series with its books in reading order', security: [], parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Series, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/SeriesDetail' } } } } } } } }

  /auth/register:
    post:
      tags: [Customer auth]
      summary: Create an account; confirm it with an email code, or with your phone number in the Telegram bot (verify_by)
      description: 'verify_by=telegram needs GET /auth/options telegram=true (else 422 on verify_by); the email is then optional; a typed email is not saved yet but gets an email-change code (pending_email in the answer) and is added by POST /me/email/verify; the website continues with POST /auth/telegram/phone, and the number shared in the bot verifies the account (it then signs in with Continue with Telegram). If the email belongs to a sign-up that was never verified, an email sign-up takes that account over (new name and password, its old sessions and codes cancelled); an unproven copy of the email on a phone account is taken off it. Forgot/reset password is refused for such an unproven email. Sign-ups still unverified after UNVERIFIED_CUSTOMER_HOURS (48) are deleted. An account with a proven email, or a deactivated or deleted one, keeps its email (422).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, password, password_confirmation]
              properties:
                name: { type: string }
                email: { type: string, format: email, description: 'Required unless verify_by=telegram' }
                password: { type: string, minLength: 8, description: Letters and numbers }
                password_confirmation: { type: string }
                phone: { type: string, description: 'Contact number for email sign-ups; ignored with verify_by=telegram (the bot gives the proven number)' }
                verify_by: { type: string, enum: [email, telegram], default: email }
                turnstile_token: { type: string, description: 'Cloudflare Turnstile token; required once TURNSTILE_SECRET_KEY is set' }
      responses:
        '201':
          description: Account + token + verify_by. Shopping routes return 403 until the account is confirmed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/TokenResponse'
                  - type: object
                    properties: { customer: { $ref: '#/components/schemas/Customer' }, message: { type: string }, verify_by: { type: string, enum: [email, telegram] } }
        '422': { $ref: '#/components/responses/Validation' }
  /auth/options:
    get: { tags: [Customer auth], summary: 'What sign-up and sign-in can offer: telegram is true once TELEGRAM_BOT_TOKEN is set', security: [], responses: { '200': { description: Options, content: { application/json: { schema: { type: object, properties: { telegram: { type: boolean } } } } } } } }
  /auth/login:
    post:
      tags: [Customer auth]
      summary: Log in with email and password
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string }, turnstile_token: { type: string, description: 'Cloudflare Turnstile token; required once TURNSTILE_SECRET_KEY is set' } } } } } }
      responses:
        '200': { description: Token, content: { application/json: { schema: { $ref: '#/components/schemas/TokenResponse' } } } }
        '401': { description: Wrong email or password }
        '403': { description: Account deactivated }
        '429': { description: Too many attempts }
  /auth/social/{provider}:
    post:
      tags: [Customer auth]
      summary: Log in with a Google or Facebook access token
      description: 'Signs in the account already linked to this Google/Facebook id, or creates one. An email proven on another account (or on a closed one) is refused with 409 (an unproven copy on a phone account is taken off it instead) and told how to sign in instead; an unfinished sign-up with that email becomes the social account (its password and sessions are removed). A new Facebook account confirms a phone number in the Telegram bot, or gives an email: without verify_by the answer is 422 with needs=phone, profile {name, email} and telegram (bot on); call again with the same access_token, verify_by (telegram or email), the email (optional with telegram; unless it is the Facebook email it is not saved yet but gets a code, pending_email in the answer) and turnstile_token. verify_by in the response says what is next: telegram (POST /auth/telegram/phone), email (a code was sent) or null (Facebook confirmed the email).'
      security: []
      parameters: [ { name: provider, in: path, required: true, schema: { type: string, enum: [google, facebook] } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [access_token], properties: { access_token: { type: string }, verify_by: { type: string, enum: [telegram, email], description: 'Facebook sign-up only' }, email: { type: string, description: 'Facebook sign-up only; required with verify_by=email' }, turnstile_token: { type: string } } } } } }
      responses: { '200': { description: Existing account }, '201': { description: New account }, '401': { description: Provider rejected the token }, '409': { description: 'The email already has an account: sign in as before' }, '422': { description: 'needs=phone (Facebook sign-up), the email is missing or taken, or Telegram is off' } }
  /auth/logout:
    post: { tags: [Customer auth], summary: 'Revoke the current token', responses: { '200': { description: Logged out } } }
  /auth/verify-email:
    post: { tags: [Customer auth], summary: 'Verify the email with the 6-digit code', requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }, responses: { '200': { description: Verified }, '422': { description: Wrong or expired code } } }
  /auth/resend-verification:
    post: { tags: [Customer auth], summary: 'Send a new email verification code (3 per 10 min per visitor; 422 without an email)', requestBody: { content: { application/json: { schema: { type: object, properties: { turnstile_token: { type: string } } } } } }, responses: { '200': { description: Sent }, '422': { $ref: '#/components/responses/Validation' } } }
  /auth/forgot-password:
    post: { tags: [Customer auth], summary: 'Email a reset code (same answer whether the email exists or not)', security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string }, turnstile_token: { type: string } } } } } }, responses: { '200': { description: OK } } }
  /auth/telegram:
    post:
      tags: [Customer auth]
      summary: Continue with Telegram (sign in), step 1
      security: []
      description: 'Makes a one-time link (10 minutes). Open `url` (t.me/<bot>?start=<code>), tap "Share my phone number" in the bot, then poll POST /auth/telegram/status with `key`. Signs in the active account that proved that +855 number. 10 links per 10 minutes per visitor.'
      responses: { '201': { description: 'url, key (keep it private), expires_at' }, '429': { description: Too many links }, '503': { description: 'The bot is off' } }
  /auth/telegram/phone:
    post:
      tags: [Customer auth]
      summary: Confirm or change your phone number with Telegram
      description: 'Same as POST /auth/telegram, for the signed-in customer: the number shared in the bot becomes the account''s verified number (and contact number), which also verifies a new account. Refused in the bot and in the status when another account (also a closed one) has the number.'
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string, description: 'Verified accounts with a password: required (a new number is a new way in)' } } } } } }
      responses: { '201': { description: 'url, key, expires_at' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: 'reason=sign_in_again: a verified account without a password signed in more than 10 minutes ago' }, '422': { $ref: '#/components/responses/Validation' }, '503': { description: 'The bot is off' } }
  /auth/telegram/status:
    post:
      tags: [Customer auth]
      summary: How a Telegram link went (the website asks every few seconds)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key], properties: { key: { type: string } } } } } }
      responses: { '200': { description: 'status pending | failed (message says why: no account with this number, number on another account, not +855, deactivated) | done (customer; plus token and expires_at for a sign-in, handed out once)' }, '404': { description: 'Unknown key, or the link expired' } }
  /auth/reset-password:
    post: { tags: [Customer auth], summary: 'Set a new password with the code (signs out everywhere)', security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string }, code: { type: string }, password: { type: string }, password_confirmation: { type: string } } } } } }, responses: { '200': { description: Reset }, '422': { description: Wrong or expired code } } }
  /me:
    get: { tags: [Customer], summary: 'Your profile', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } } } }
    patch: { tags: [Customer], summary: 'Update name, phone, or locale (en|km)', responses: { '200': { description: Updated } } }
    delete:
      tags: [Customer]
      summary: Close your own account
      description: 'Confirm with the password, or (accounts without one) a fresh Google/Facebook access token for the linked account, plus confirm=DELETE. Refused while an order is on its way or a return is open. Signs out everywhere, removes reviews, wishlist and cart, and hides the account; personal details are erased after CLOSED_ACCOUNT_DAYS (30) by customers:erase-closed. Orders and returns are kept.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, enum: [DELETE] }, password: { type: string }, provider: { type: string, enum: [google, facebook] }, access_token: { type: string } } } } } }
      responses: { '200': { description: 'Closed; erase_at says when the details are erased' }, '422': { $ref: '#/components/responses/Validation' } }
  /me/password:
    put: { tags: [Customer], summary: 'Change password (signs out other devices)', description: 'A first password (account without one) needs a sign-in in the last 10 minutes.', responses: { '200': { description: Changed }, '403': { description: 'reason=sign_in_again' }, '422': { $ref: '#/components/responses/Validation' } } }
  /me/email:
    post:
      tags: [Customer]
      summary: Add or change your email (step 1, code to the new address)
      description: 'The password is required when the account has one. Nothing changes until the code comes back (step 2). Refused when another account (also a closed one) uses the address, or it is already yours. At most 5 codes an hour per account, plus the otp-send limit and Turnstile.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, password: { type: string }, turnstile_token: { type: string } } } } } }
      responses: { '200': { description: 'Code sent; email is the address it went to' }, '403': { description: 'reason=sign_in_again: no password and the last sign-in is more than 10 minutes old' }, '422': { $ref: '#/components/responses/Validation' } }
  /me/email/verify:
    post:
      tags: [Customer]
      summary: Confirm the new email with its code (step 2)
      description: 'Saves the address as verified, cancels codes sent to the old address, signs out other devices, and tells the old address (if it was proven) about the change.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses: { '200': { description: 'Saved (customer in the body)' }, '422': { description: 'Wrong or expired code, or the address was taken meanwhile' } }
  /me/connections/{provider}:
    post:
      tags: [Customer]
      summary: Connect Google or Facebook to your account
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      description: 'A fresh access token from the provider (checked as issued to our app; the profile is read from the provider) plus the password when the account has one. The provider account must not be linked to another Bookly account. A verified email gets a notice.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [access_token], properties: { access_token: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: 'Connected (customer in the body)' }, '403': { description: 'reason=sign_in_again: no password and the last sign-in is more than 10 minutes old' }, '409': { description: 'Used by another Bookly account, or another account of this provider is connected' }, '422': { description: 'Wrong password, or the token could not be verified (422, not 401, so the session stays)' } }
    delete:
      tags: [Customer]
      summary: Disconnect Google or Facebook
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      description: 'Refused with reason=last_way_in when it is the only way left to sign in ("Add a password first, so you can still sign in."). A verified email gets a notice.'
      responses: { '200': { description: 'Disconnected (customer in the body)' }, '422': { description: 'It is the last way in' } }
  /me/store-credits:
    get:
      tags: [Customer]
      summary: Active store credits for the signed-in customer
      description: 'Lists active, unexpired, and unused store credit coupons bound to the current customer.'
      responses:
        '200':
          description: Store credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string, example: CREDIT-ABCD-1234 }
                        value_usd: { type: string, example: '25.00' }
                        type: { type: string, example: fixed }
                        used_count: { type: integer }
                        max_uses: { type: integer, nullable: true }
                        starts_at: { type: string, format: date-time, nullable: true }
                        expires_at: { type: string, format: date-time, nullable: true }
                        created_at: { type: string, format: date-time }
  /me/stock-alerts:
    get:
      tags: [Customer]
      summary: Active and past stock alerts for the signed-in customer
      responses:
        '200':
          description: Stock alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
    post:
      tags: [Customer]
      summary: Subscribe to back-in-stock alert for a physical variant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_variant_id]
              properties:
                book_variant_id: { type: integer, example: 1 }
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StockAlert' }
        '422': { $ref: '#/components/responses/Validation' }
  /me/stock-alerts/{id}:
    delete:
      tags: [Customer]
      summary: Delete a stock alert
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /addresses:
    get: { tags: [Customer], summary: 'Saved addresses (default first)', responses: { '200': { description: Addresses, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Address' } } } } } } } } }
    post: { tags: [Customer], summary: 'Add an address (max 10; first one is default)', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }, responses: { '201': { description: Created } } }
  /addresses/{id}:
    patch: { tags: [Customer], summary: 'Update; is_default: true moves the default', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated } } }
    delete: { tags: [Customer], summary: 'Delete (the newest remaining becomes default)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /cart:
    get: { tags: [Customer], summary: 'Cart with current prices and per-line issues', responses: { '200': { description: Cart, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Cart' } } } } } } } }
    delete: { tags: [Customer], summary: 'Empty the cart', responses: { '200': { description: Empty cart } } }
  /cart/items:
    post:
      tags: [Customer]
      summary: Add a format (same format again increases quantity; max 10; ebooks/audiobooks 1)
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [book_variant_id], properties: { book_variant_id: { type: integer }, quantity: { type: integer, default: 1 } } } } } }
      responses: { '201': { description: Cart }, '422': { description: 'Not available, out of stock or over the limit' } }
  /cart/items/{id}:
    patch: { tags: [Customer], summary: 'Set quantity', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Cart } } }
    delete: { tags: [Customer], summary: 'Remove a line', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Cart } } }
  /cart/coupon/check:
    post: { tags: [Customer], summary: 'Preview a coupon against the cart (10/min)', requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }, responses: { '200': { description: Discount preview, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CouponCheck' } } } } } }, '422': { description: 'Invalid, expired, used up, minimum not met or already used by you' } } }
  /wishlist:
    get: { tags: [Customer], summary: 'Saved books (newest first)', responses: { '200': { description: Book cards, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/BookCard' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
    post: { tags: [Customer], summary: 'Save a book', requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { book_id: { type: integer } } } } } }, responses: { '201': { description: Added }, '200': { description: Already saved } } }
  /wishlist/{id}:
    delete: { tags: [Customer], summary: 'Remove a book', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { $ref: '#/components/responses/NoContent' } } }

  /checkout/preview:
    post: { tags: [Checkout & orders], summary: 'Totals for the cart (subtotal, discount, shipping, tax, total in USD and KHR)', description: 'Delivery is priced for address_id, else the default address: Phnom Penh 1.50 USD, the provinces 3.00 USD (SHIPPING_FEE_PHNOM_PENH / SHIPPING_FEE_PROVINCES).', requestBody: { content: { application/json: { schema: { type: object, properties: { coupon_code: { type: string }, address_id: { type: integer }, delivery_note: { type: string, maxLength: 300 } } } } } }, responses: { '422': { description: 'address_id is not one of your addresses, or a bad coupon' }, '200': { description: Totals, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CheckoutPreview' } } } } } } } }
  /checkout:
    post:
      tags: [Checkout & orders]
      summary: Place a cash-on-delivery order from the cart
      description: Prices are re-checked at today's price, stock is taken out of stock, the coupon is applied and the cart is emptied. Repeating a request with the same Idempotency-Key returns the same order.
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 }, description: New random value per order }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [address_id, payment_method], properties: { address_id: { type: integer }, payment_method: { type: string, enum: [cod] }, coupon_code: { type: string }, delivery_note: { type: string, maxLength: 300 } } } } } }
      responses:
        '201': { description: Order placed, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Order' } } } } } }
        '200': { description: Same key repeated — the existing order (header Idempotent-Replayed true) }
        '422': { description: 'Cart empty or has issues, bad address, coupon or key' }
  /orders:
    get: { tags: [Checkout & orders], summary: 'Your orders (status filter)', responses: { '200': { description: 'Orders (without status_history)', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /orders/{id}:
    get: { tags: [Checkout & orders], summary: 'One order with status history', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Order }, '404': { $ref: '#/components/responses/NotFound' } } }
  /orders/{id}/cancel:
    post: { tags: [Checkout & orders], summary: 'Cancel while pending (stock and coupon use are given back)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Cancelled }, '422': { description: No longer cancellable } } }
  /orders/{id}/invoice:
    get: { tags: [Checkout & orders], summary: 'Print data for your invoice (not for a cancelled order)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Invoice data, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OrderDocument' } } } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { description: Cancelled order } } }
  /orders/{id}/returnable-items:
    get: { tags: [Returns & reviews], summary: 'What can still be returned, and until when', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Returnable items } } }
  /orders/{id}/returns:
    post:
      tags: [Returns & reviews]
      summary: Request a return (delivered orders, within 3 days of delivery, physical formats only)
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [reason, items], properties: { reason: { type: string }, items: { type: array, items: { type: object, properties: { order_item_id: { type: integer }, quantity: { type: integer }, reason: { type: string } } } } } } } } }
      responses: { '201': { description: Return, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Return' } } } } } }, '422': { $ref: '#/components/responses/Validation' } }
  /returns:
    get: { tags: [Returns & reviews], summary: 'Your returns', responses: { '200': { description: Returns, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Return' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /returns/{id}:
    get: { tags: [Returns & reviews], summary: 'One return', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Return } } }
    delete: { tags: [Returns & reviews], summary: 'Withdraw while requested', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { $ref: '#/components/responses/NoContent' }, '422': { description: Already handled } } }
  /reviews:
    get: { tags: [Returns & reviews], summary: 'Your reviews (incl. hidden ones)', responses: { '200': { description: Reviews, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OwnReview' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
