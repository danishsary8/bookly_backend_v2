    post: { tags: [Staff operations], summary: 'Mark all read', responses: { '200': { description: OK } } }
  /staff/notifications/{id}/read:
    post: { tags: [Staff operations], summary: 'Mark one read', parameters: [ { name: id, in: path, required: true, schema: { type: string, format: uuid } } ], responses: { '200': { description: OK } } }

  /staff/members:
    get: { tags: [Admin], summary: '(admin) Staff accounts', responses: { '200': { description: Members } } }
    post: { tags: [Admin], summary: '(admin) Invite staff (name, email, role) — they set their own password from the emailed code', responses: { '201': { description: Invited } } }
  /staff/members/{id}:
    patch: { tags: [Admin], summary: '(admin) Change name, role or permissions (role/permission change signs them out)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated }, '422': { description: Self change or last admin } } }
  /staff/members/{id}/login-history:
    get:
      tags: [Admin]
