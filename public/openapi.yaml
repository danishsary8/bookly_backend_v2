openapi: 3.0.3
info:
  title: Bookly API
  version: "1.0"
  description: |
    The API behind **Bookly**, an online bookshop in Cambodia. Built with Laravel 13 and PostgreSQL.

    ### Try it in 3 steps
    1. Click **Sign in as demo customer** at the top of the page. This fills in **Authorize** for you.
    2. Open an endpoint, for example **Customer → GET /cart**.
    3. Press **Try it out**, then **Execute**. You get a real answer from the live API.

    Staff endpoints answer **403** to the demo token. That is the security working: a customer can never use staff routes.

    ### How sign-in works
    You log in and get a **token**. Send it with every request as `Authorization: Bearer <token>`.
    Customer tokens last 7 days. Staff tokens last 12 hours and need a code from an authenticator app (2FA).

    ### Errors
    Errors are always JSON: `{"message": "..."}`. Wrong form data gives **422** with an `errors` list.
    **401** = not signed in, **403** = not allowed, **429** = too many requests (wait and try again).
    Every response has an `X-Request-Id` header to help find a problem in the logs.

    ### Limits
    120 requests per minute, plus stricter limits on sign-in, codes, coupons and checkout.
    Lists are paged: use `page` and `per_page` (max 100).
servers:
  - url: /api/v1
tags:
  - { name: Public, description: 'No login needed: catalog, reviews, health' }
  - { name: Customer auth, description: 'Register, verify email, log in, reset password' }
  - { name: Customer, description: 'Profile, addresses, cart, wishlist (verified customers)' }
  - { name: Checkout & orders, description: 'Cash-on-delivery checkout and order history' }
  - { name: Returns & reviews, description: 'Returns for delivered orders and book reviews' }
  - { name: Staff auth, description: '🔒 Staff only · Staff login with required authenticator-app 2FA' }
  - { name: Staff catalog, description: '🔒 Staff only · Books, formats, authors, categories, publishers, series' }
  - { name: Staff operations, description: '🔒 Staff only · Coupons, orders, returns, reviews, customers, alerts' }
  - { name: Newsletter, description: 'Sign up for the newsletter (double opt-in) and unsubscribe' }
  - { name: Admin, description: '🔒 Staff only · Admin-only: staff, exchange rates, audit log, dashboard, export' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        Sanctum personal access token. Customer tokens come from `POST /auth/login` (ability `customer`, 7 days);
        staff tokens from `POST /staff/auth/login` plus a TOTP code (ability `staff`, 12 hours). A token only works on
        its own side of the API. On this page, the *Sign in as demo customer* button fills it in for you.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string, enum: [google, facebook] }
    PerPage:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Period:
      name: period
      in: query
      schema: { type: string, enum: [today, 7d, 30d, 90d, 12m, custom], default: 30d }
    From:
      name: from
      in: query
      schema: { type: string, format: date }
    To:
      name: to
      in: query
      schema: { type: string, format: date }
  responses:
    Validation:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationError' }
    Unauthorized:
      description: Not logged in or token expired
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Not allowed for this account
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found (also returned for another customer's records)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { message: Not found. }
    NoContent:
      description: Done, no body
  schemas:
    AssistantResponse:
      type: object
      required: [intent, text, link, books, handoff]
      properties:
        intent: { type: string }
        text: { type: string }
        link: { type: string, nullable: true }
        books: { type: array, maxItems: 5, items: { $ref: '#/components/schemas/BookCard' } }
        handoff: { type: boolean }
    AssistantFaq:
      type: object
      required: [id, question_en, question_km, answer_en, answer_km, keywords, is_active, hits]
      properties:
        id: { type: integer }
        question_en: { type: string, maxLength: 300 }
        question_km: { type: string, maxLength: 300 }
        answer_en: { type: string, maxLength: 2000 }
        answer_km: { type: string, maxLength: 2000 }
        keywords: { type: array, items: { type: string } }
        is_active: { type: boolean }
        hits: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AssistantFaqInput:
      type: object
      required: [question_en, question_km, answer_en, answer_km, keywords, is_active]
      properties:
        question_en: { type: string, maxLength: 300 }
        question_km: { type: string, maxLength: 300 }
        answer_en: { type: string, maxLength: 2000 }
        answer_km: { type: string, maxLength: 2000 }
        keywords: { type: array, minItems: 1, maxItems: 20, items: { type: string, maxLength: 100 } }
        is_active: { type: boolean }
        unanswered_id: { type: integer }
    AssistantUnanswered:
      type: object
      required: [id, question, count, last_seen]
      properties:
        id: { type: integer }
        question: { type: string, maxLength: 300 }
        count: { type: integer }
        last_seen: { type: string, format: date-time }
    SupportMessage:
      type: object
      required: [id, sender, body, is_internal, created_at, read_at]
      properties:
        id: { type: integer }
        sender: { type: string, enum: [customer, staff, system] }
        body: { type: string, maxLength: 2000 }
        is_internal: { type: boolean }
        created_at: { type: string, format: date-time }
        read_at: { type: string, format: date-time, nullable: true }
    SupportConversation:
      type: object
      required: [id, topic, order_id, status, assigned_staff_id, last_message_at, closed_at, unread_count]
      properties:
        id: { type: integer }
        topic: { type: string, enum: [order, payment, ebook, delivery, other] }
        order_id: { type: integer, nullable: true }
        status: { type: string, enum: [open, pending, closed] }
        assigned_staff_id: { type: integer, nullable: true }
        last_message_at: { type: string, format: date-time, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        unread_count: { type: integer }
        customer:
          type: object
          description: Staff-only; omitted for customers
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, nullable: true }
            email: { type: string, nullable: true }
        rating:
          type: object
          nullable: true
          properties:
            stars: { type: integer, minimum: 1, maximum: 5 }
            comment: { type: string, nullable: true }
        messages: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/SupportMessage' } }
    SupportQuickReply:
      type: object
      required: [id, title, body_en, body_km]
      properties:
        id: { type: integer }
        title: { type: string }
        body_en: { type: string }
        body_km: { type: string }
        created_at: { type: string }
        updated_at: { type: string }
    OrderRating:
      type: object
      properties:
        id: { type: integer }
        order_id: { type: integer }
        order_number: { type: string, nullable: true }
        stars: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true, maxLength: 500 }
        is_comment_hidden: { type: boolean }
        created_at: { type: string, format: date-time }
        editable_until: { type: string, format: date-time }
        can_edit: { type: boolean }
    StoreRating:
      type: object
      nullable: true
      properties:
        count: { type: integer, minimum: 10 }
        average: { type: number }
    ReadingList:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string, maxLength: 100 }
        description: { type: string, nullable: true, maxLength: 2000 }
        is_public: { type: boolean }
        is_staff_pick: { type: boolean }
        owner_first_name: { type: string, description: 'First name only; never email or full customer data' }
        books:
          type: array
          maxItems: 200
          items:
            type: object
            properties:
              book: { $ref: '#/components/schemas/BookCard' }
              position: { type: integer }
              note: { type: string, nullable: true }
    ReadingListInput:
      type: object
      properties:
        title: { type: string, maxLength: 100 }
        description: { type: string, maxLength: 2000, nullable: true }
        is_public: { type: boolean }
    FreeGift:
      type: object
      nullable: true
      properties:
        id: { type: integer }
        offer_id: { type: integer }
        name_en: { type: string }
        name_km: { type: string }
        quantity: { type: integer }
        limited: { type: boolean }
    Gift:
      type: object
      properties:
        id: { type: integer }
        name_en: { type: string, maxLength: 100 }
        name_km: { type: string, maxLength: 100 }
        image_url: { type: string, nullable: true }
        stock: { type: integer, minimum: 0 }
        is_active: { type: boolean }
    Error:
      type: object
      properties:
        message: { type: string }
    ValidationError:
      type: object
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
    Money:
      type: string
      description: Decimal amount with 2 decimals, e.g. "19.99"
      example: "19.99"
    Riel:
      type: string
      nullable: true
      description: Whole riel, null when no USD->KHR rate is set
      example: "81959"
    PageMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }
        path: { type: string }
    UploadedMedia:
      type: object
      required: [url, path, filename, width, height, size_bytes, mime]
      properties:
        url: { type: string, format: uri }
        path: { type: string }
        filename: { type: string }
        width: { type: integer }
        height: { type: integer }
        size_bytes: { type: integer }
        mime: { type: string }
    PageLinks:
      type: object
      properties:
        first: { type: string, nullable: true }
        last: { type: string, nullable: true }
        prev: { type: string, nullable: true }
        next: { type: string, nullable: true }
    Amount:
      type: object
      description: The same amount in US dollars and in riel (khr is null when no exchange rate is set)
      properties:
        usd: { $ref: '#/components/schemas/Money' }
        khr: { $ref: '#/components/schemas/Riel' }
    Author:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        bio: { type: string, nullable: true }
        photo_url: { type: string, nullable: true }
        books_count: { type: integer }
    Category:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        parent_id: { type: integer, nullable: true, description: 'Two levels: null = top-level' }
        sort_order: { type: integer }
        icon: { type: string, nullable: true, description: 'Lucide icon name, e.g. book-open' }
        books_count: { type: integer }
    CategoryNode:
      type: object
      description: 'GET /categories?tree=1: a top-level category with its non-empty children'
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        parent_id: { type: integer, nullable: true }
        sort_order: { type: integer }
        icon: { type: string, nullable: true }
        books_count: { type: integer }
        total_books: { type: integer, description: 'Books in this category or its children, each counted once' }
        children: { type: array, items: { $ref: '#/components/schemas/CategoryNode' } }
    Publisher:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        books_count: { type: integer }
    Series:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        books_count: { type: integer }
    SeriesDetail:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        books_count: { type: integer, nullable: true }
        total_volumes: { type: integer, nullable: true }
        owned_count: { type: integer, nullable: true }
        in_cart_count: { type: integer, nullable: true }
        books: { type: array, items: { $ref: '#/components/schemas/BookCard' } }
    RatingSummary:
      type: object
      properties:
        average: { type: number, nullable: true }
        count: { type: integer }
        distribution:
          type: object
          description: 'Number of reviews per star, keys "5" to "1"'
          additionalProperties: { type: integer }
    EstimatedDelivery:
      type: object
      properties:
        days_min: { type: integer, example: 1 }
        days_max: { type: integer, example: 2 }
        delivery_time_en: { type: string, example: '1 working day' }
        delivery_time_km: { type: string, example: '១ ថ្ងៃធ្វើការ' }
        earliest_date: { type: string, format: date, example: '2026-10-17' }
        latest_date: { type: string, format: date, example: '2026-10-19' }
        formatted: { type: string, example: '1 working day (Sat, 17 Oct)' }
    DeliveryProvince:
      type: object
      properties:
        code: { type: string, example: phnom_penh }
        name_en: { type: string, example: Phnom Penh }
        name_km: { type: string, example: ភ្នំពេញ }
        area: { type: string, enum: [phnom_penh, provinces] }
        fee_usd: { $ref: '#/components/schemas/Money' }
        fee_khr: { $ref: '#/components/schemas/Riel' }
        days_min: { type: integer, example: 1 }
        days_max: { type: integer, example: 2 }
        delivery_time_en: { type: string, example: '1 working day' }
        delivery_time_km: { type: string, example: '១ ថ្ងៃធ្វើការ' }
    DeliveryOptionsData:
      type: object
      properties:
        free_shipping:
          type: object
          properties:
            threshold_usd: { $ref: '#/components/schemas/Money', nullable: true }
            threshold_khr: { $ref: '#/components/schemas/Riel', nullable: true }
            is_active: { type: boolean }
        shipping_fees:
          type: object
          properties:
            phnom_penh_usd: { $ref: '#/components/schemas/Money' }
            phnom_penh_khr: { $ref: '#/components/schemas/Riel' }
            provinces_usd: { $ref: '#/components/schemas/Money' }
            provinces_khr: { $ref: '#/components/schemas/Riel' }
        provinces:
          type: array
          items: { $ref: '#/components/schemas/DeliveryProvince' }
        payment_methods:
          type: array
          description: Ways to pay. The shop shows KHQR only when it is listed (KHQR payments design 3.3).
          items:
            type: object
            properties:
              code: { type: string, enum: [cod, khqr] }
              mode: { type: string, enum: [test, bakong], description: 'khqr only: test = Simulate button, no real money' }
              pay_minutes: { type: integer, example: 15, description: khqr only }
    KhqrPayment:
      type: object
      properties:
        order_id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [awaiting_payment, paid, expired, cancelled] }
        mode: { type: string, enum: [test, bakong] }
        expires_at: { type: string, format: date-time }
        seconds_left: { type: integer }
        total_usd: { $ref: '#/components/schemas/Money' }
        paid:
          type: object
          nullable: true
          properties:
            currency: { type: string, enum: [USD, KHR] }
            amount: { type: string }
            paid_at: { type: string, format: date-time, nullable: true }
        qrs:
          type: array
          description: The waiting QR codes (USD first, KHR once asked); empty unless awaiting_payment.
          items:
            type: object
            properties:
              currency: { type: string, enum: [USD, KHR] }
              amount: { type: string, example: '26.50', description: 'USD with 2 decimals; KHR whole riel' }
              qr: { type: string, description: KHQR string (EMVCo); draw it as a QR code }
              md5: { type: string, description: Bakong's lookup key (md5 of qr) }
    CheckoutPreview:
      type: object
      properties:
        credit_balance: { $ref: '#/components/schemas/Amount' }
        credit_used: { $ref: '#/components/schemas/Amount' }
        payment_due: { $ref: '#/components/schemas/Amount' }
        referral_discount: { $ref: '#/components/schemas/Amount' }
        has_delivery_address: { type: boolean, description: 'A saved address was selected or defaulted; otherwise delivery_area is an estimate choice only.' }
        free_gift: { $ref: '#/components/schemas/FreeGift' }
        subtotal: { $ref: '#/components/schemas/Amount' }
        discount: { $ref: '#/components/schemas/Amount' }
        shipping_fee: { $ref: '#/components/schemas/Amount' }
        tax: { $ref: '#/components/schemas/Amount' }
        total: { $ref: '#/components/schemas/Amount' }
        coupon_code: { type: string, nullable: true, description: 'Set only when the coupon won against the offer.' }
        applied: { type: string, enum: [offer, coupon], nullable: true, description: 'Which discount `discount` and `total` use (never both; bigger wins; tie -> offer).' }
        offer: { $ref: '#/components/schemas/CartOffer' }
        coupon_not_used: { $ref: '#/components/schemas/CouponNotUsed' }
        requires_shipping: { type: boolean, description: false when the cart only has ebooks/audiobooks }
        delivery_area: { type: string, enum: [phnom_penh, provinces], nullable: true, description: 'Area the shipping fee was priced for; null when the customer has no address yet (the provinces fee is quoted)' }
        can_checkout: { type: boolean }
        is_free_shipping: { type: boolean }
        free_shipping_threshold: { allOf: [{ $ref: '#/components/schemas/Amount' }], nullable: true }
        amount_needed_for_free_shipping: { allOf: [{ $ref: '#/components/schemas/Amount' }], nullable: true }
        province_code: { type: string, nullable: true }
        province_name: { type: string, nullable: true }
        estimated_delivery: { $ref: '#/components/schemas/EstimatedDelivery', nullable: true }
        has_preorder: { type: boolean }
        has_backorder: { type: boolean }
        expected_ship_date: { type: string, format: date, nullable: true }
        shipping_notice: { type: string, nullable: true }
    CouponCheck:
      type: object
      properties:
        code: { type: string }
        type: { type: string, enum: [percentage, fixed] }
        value: { $ref: '#/components/schemas/Money' }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        discount_khr: { $ref: '#/components/schemas/Riel' }
        total_before_shipping_usd: { $ref: '#/components/schemas/Money' }
        total_before_shipping_khr: { $ref: '#/components/schemas/Riel' }
        applied: { type: string, enum: [offer, coupon], description: 'The discount the customer gets (the fields above are the coupon alone).' }
        offer: { $ref: '#/components/schemas/CartOffer' }
        coupon_not_used: { $ref: '#/components/schemas/CouponNotUsed' }
        best_discount_usd: { $ref: '#/components/schemas/Money' }
        best_discount_khr: { $ref: '#/components/schemas/Riel' }
        best_total_before_shipping_usd: { $ref: '#/components/schemas/Money' }
        best_total_before_shipping_khr: { $ref: '#/components/schemas/Riel' }
        free_shipping: { $ref: '#/components/schemas/CartFreeShipping' }
    CartOffer:
      type: object
      nullable: true
      description: The best live offer for the cart (tie -> lower id); null when none applies.
      properties:
        id: { type: integer }
        type: { type: string, enum: [buy_n_percent] }
        min_quantity: { type: integer, example: 2 }
        percent_off: { type: string, example: '15.00' }
        ends_at: { type: string, format: date-time, nullable: true }
        target_label: { type: string, nullable: true, description: 'Series or category name when the offer has exactly one such target; else null.' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        discount_khr: { $ref: '#/components/schemas/Riel' }
    CartFreeShipping:
      type: object
      nullable: true
      description: Null when free delivery is off (FREE_SHIPPING_THRESHOLD empty or 0) or the cart has only ebooks/audiobooks. Judged on subtotal minus discount, like checkout.
      properties:
        threshold_usd: { $ref: '#/components/schemas/Money' }
        threshold_khr: { $ref: '#/components/schemas/Riel' }
        amount_needed_usd: { $ref: '#/components/schemas/Money' }
        amount_needed_khr: { $ref: '#/components/schemas/Riel' }
        is_free: { type: boolean }
    CouponNotUsed:
      type: object
      nullable: true
      description: A valid coupon that was not used because the offer saves at least as much.
      properties:
        code: { type: string, example: READ10 }
        reason: { type: string, enum: [offer_better] }
    TokenResponse:
      type: object
      properties:
        token: { type: string }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time }
    Customer:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, nullable: true, description: 'Null for Facebook accounts that signed up with a phone number only' }
        phone: { type: string, nullable: true, description: Contact number as shown to people }
        phone_number: { type: string, nullable: true, description: 'Verified number in international form (+85512345678)' }
        phone_verified: { type: boolean }
        email_verified: { type: boolean }
        verified: { type: boolean, description: 'Email or phone proven; only verified customers can shop' }
        has_password: { type: boolean }
        locale: { type: string, enum: [en, km], example: en }
        telegram_chat_id: { type: integer, nullable: true, description: 'Telegram chat ID linked to this customer account' }
        telegram_connected: { type: boolean, description: 'True if a Telegram chat ID has been linked' }
        telegram_order_updates: { type: boolean, description: 'True if customer has enabled real-time order notifications on Telegram' }
        price_drop_alerts: { type: boolean, description: 'Email me when a book on my "Want to read" wishlist drops 5% or more (at most one email per book per week). Off by default.' }
        cart_reminders: { type: boolean, description: 'One email 24 hours after books are left in the cart (at most one a week, and only after the cart changed). On by default.' }
        connected: { type: object, properties: { google: { type: boolean }, facebook: { type: boolean } } }
        sign_in_methods: { type: array, items: { type: string, enum: [password, google, facebook, telegram] }, description: 'Ways this account can sign in today (password counts only with an email; telegram means a verified number, while the Telegram bot is on). The last one cannot be removed.' }
        pending_email: { type: string, nullable: true, description: 'Only on the customer''s own account: an address that was sent a code (Telegram sign-up, change email) and is added once POST /me/email/verify gets that code.' }
        created_at: { type: string, format: date-time }
    BookCard:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        language: { type: string }
        age_min: { type: integer, nullable: true, description: 'Youngest reader age (0-18)' }
        age_max: { type: integer, nullable: true }
        school_grade: { type: integer, nullable: true, description: 'Khmer school grade (1-12)' }
        level: { type: string, nullable: true, enum: [A1, A2, B1, B2, C1, C2, null], description: English learning level }
        publish_date: { type: string, format: date, nullable: true }
        authors: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string } } } }
        cover_image_url: { type: string, nullable: true }
        price_from_usd: { $ref: '#/components/schemas/Money' }
        price_from_khr: { $ref: '#/components/schemas/Riel' }
        formats: { type: array, items: { type: string, enum: [hardcover, paperback, ebook, audiobook] } }
        in_stock: { type: boolean }
        rating_avg: { type: number, nullable: true }
        review_count: { type: integer }
        reader_rating: { type: number, nullable: true, minimum: 1, maximum: 5, description: 'A public score staff entered for the book (one decimal), shown with its source until customers review it.' }
        reader_rating_source: { type: string, nullable: true, maxLength: 60, description: 'Where reader_rating comes from, e.g. Goodreads. Null when reader_rating is null.' }
        sold_count: { type: integer, nullable: true, minimum: 5, description: 'Copies ordered in the last 90 days excluding cancelled and deleted orders; cached hourly. Null below 5.' }
        low_stock_remaining: { type: integer, nullable: true, description: 'Remaining copies of the cheapest active format when physical, released and between 1 and shop.low_stock_badge; otherwise null.' }
        offer: { $ref: '#/components/schemas/BookOffer' }
        series_order: { type: integer, nullable: true }
    OfferReportRow:
      type: object
      properties:
        orders: { type: integer }
        units: { type: integer, description: All books in those orders }
        units_with_offer: { type: integer, description: Books on lines that got a discount }
        revenue_usd: { $ref: '#/components/schemas/Money' }
        revenue_khr: { $ref: '#/components/schemas/Riel' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        discount_khr: { $ref: '#/components/schemas/Riel' }
        average_order_usd: { $ref: '#/components/schemas/Money' }
        average_order_khr: { $ref: '#/components/schemas/Riel' }
        books_per_order: { type: string, example: '2.50' }
    SeasonalCollection:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string, example: rainy-season-reads }
        title_en: { type: string }
        title_km: { type: string, nullable: true, description: 'Null: the shop shows title_en in Khmer too' }
        description_en: { type: string, nullable: true }
        description_km: { type: string, nullable: true }
        ends_at: { type: string, format: date-time, nullable: true }
        books_count: { type: integer, description: Visible books in the collection }
        books: { type: array, items: { $ref: '#/components/schemas/BookCard' } }
    BookOffer:
      type: object
      nullable: true
      description: 'The best live automatic offer covering this book (biggest percent; tie -> lower min_quantity, then lower id), or null. Live offers are cached 60 seconds; checkout always re-checks.'
      properties:
        id: { type: integer }
        min_quantity: { type: integer, example: 2 }
        percent_off: { type: string, example: '15.00' }
        ends_at: { type: string, format: date-time, nullable: true }
        target_label: { type: string, nullable: true, description: 'Series or category name when the offer has exactly one such target; else null.' }
    Variant:
      type: object
      properties:
        id: { type: integer }
        format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
        isbn: { type: string, nullable: true }
        price_usd: { $ref: '#/components/schemas/Money' }
        price_khr: { $ref: '#/components/schemas/Riel' }
        in_stock: { type: boolean }
        cover_image_url: { type: string, nullable: true }
        release_date: { type: string, format: date, nullable: true }
        allow_backorder: { type: boolean }
        is_preorder: { type: boolean }
        is_backorder: { type: boolean }
        low_stock_remaining: { type: integer, nullable: true, description: 'Physical stock from 1 through shop.low_stock_badge; null for digital, preorders, backorders and out of stock.' }
    BookDetail:
      allOf:
        - $ref: '#/components/schemas/BookCard'
        - type: object
          properties:
            description: { type: string, nullable: true }
            page_count: { type: integer, nullable: true }
            categories: { type: array, items: { type: object, properties: { id: { type: integer }, name: { type: string }, slug: { type: string } } } }
            publisher: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string } } }
            series: { type: object, nullable: true, properties: { id: { type: integer }, name: { type: string }, order: { type: integer, nullable: true } } }
            variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
    Address:
      type: object
      properties:
        id: { type: integer }
        label: { type: string, nullable: true }
        recipient_name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string, nullable: true }
        city: { type: string }
        state: { type: string, nullable: true }
        postal_code: { type: string, nullable: true }
        country: { type: string }
        is_default: { type: boolean }
        latitude: { type: number, nullable: true, description: 'Optional map pin (with longitude), inside Cambodia (9.5–15)' }
        longitude: { type: number, nullable: true, description: 'Optional map pin (with latitude), inside Cambodia (102–108)' }
    AddressInput:
      type: object
      required: [recipient_name, phone, address_line1, city, country]
      properties:
        label: { type: string }
        recipient_name: { type: string }
        phone: { type: string }
        address_line1: { type: string }
        address_line2: { type: string }
        city: { type: string }
        state: { type: string }
        postal_code: { type: string }
        country: { type: string }
        is_default: { type: boolean }
        latitude: { type: number, nullable: true, description: 'Optional map pin (with longitude), inside Cambodia (9.5–15)' }
        longitude: { type: number, nullable: true, description: 'Optional map pin (with latitude), inside Cambodia (102–108)' }
    CartIssue:
      type: object
      properties:
        code: { type: string, enum: [unavailable, out_of_stock, insufficient_stock, price_changed] }
        message: { type: string }
        available_quantity: { type: integer }
        previous_price_usd: { $ref: '#/components/schemas/Money' }
    Cart:
      type: object
      properties:
        free_gift: { $ref: '#/components/schemas/FreeGift' }
        id: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              book_variant_id: { type: integer }
              book: { type: object, properties: { id: { type: integer }, title: { type: string } } }
              format: { type: string }
              cover_image_url: { type: string, nullable: true }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              unit_price_khr: { $ref: '#/components/schemas/Riel' }
              line_total_usd: { $ref: '#/components/schemas/Money' }
              line_total_khr: { $ref: '#/components/schemas/Riel' }
              issues: { type: array, items: { $ref: '#/components/schemas/CartIssue' } }
              in_offer: { type: boolean, description: 'True when the automatic offer in `pricing.offer` discounts this line.' }
              low_stock_remaining: { type: integer, nullable: true, description: 'Real low-stock count for this format; null when no badge applies.' }
        item_count: { type: integer }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_khr: { $ref: '#/components/schemas/Riel' }
        can_checkout: { type: boolean }
        pricing: { $ref: '#/components/schemas/CartPricing' }
    CartPricing:
      type: object
      description: |
        The automatic offer for this cart (no coupon: coupons are compared in POST /cart/coupon/check).
        `subtotal_usd` is before any discount, like the cart's own `subtotal_usd`.
      properties:
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_khr: { $ref: '#/components/schemas/Riel' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        discount_khr: { $ref: '#/components/schemas/Riel' }
        total_before_shipping_usd: { $ref: '#/components/schemas/Money' }
        total_before_shipping_khr: { $ref: '#/components/schemas/Riel' }
        offer: { $ref: '#/components/schemas/CartOffer' }
        nudge:
          type: object
          nullable: true
          description: |
            At most one: an offer the cart has at least 1 covered book for but fewer than `min_quantity`; when an
            offer already applies, only an offer with a higher percent. Fewest extra books first.
          properties:
            offer_id: { type: integer }
            add_quantity: { type: integer, example: 1 }
            percent_off: { type: string, example: '15.00' }
            target_label: { type: string, nullable: true }
        free_shipping: { $ref: '#/components/schemas/CartFreeShipping' }
    Order:
      type: object
      properties:
        credit_used_usd: { $ref: '#/components/schemas/Money' }
        payment_due_usd: { $ref: '#/components/schemas/Money' }
        free_gift: { $ref: '#/components/schemas/FreeGift' }
        id: { type: integer }
        order_number: { type: string, example: ORD-20261003-7K2QX }
        status: { type: string, enum: [pending, paid, processing, shipped, delivered, cancelled, returned] }
        payment_method: { type: string, enum: [card, cod, khqr] }
        payment_status: { type: string, enum: [pending, succeeded, failed, refunded] }
        payment_due_at: { type: string, format: date-time, nullable: true, description: 'KHQR order waiting for payment: when the time to pay ends; else null' }
        placed_at: { type: string, format: date-time }
        is_waiting_stock: { type: boolean }
        expected_ship_date: { type: string, format: date, nullable: true }
        item_count: { type: integer }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              book_variant_id: { type: integer }
              book_id: { type: integer }
              title: { type: string }
              format: { type: string }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              subtotal_usd: { $ref: '#/components/schemas/Money' }
              discount_usd: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: "This line's share of the order discount; the lines add up to the order's discount_usd (0.00 on older orders)." }
              is_preorder: { type: boolean }
              is_backorder: { type: boolean }
              expected_date: { type: string, format: date, nullable: true }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        shipping_fee_usd: { $ref: '#/components/schemas/Money' }
        tax_usd: { $ref: '#/components/schemas/Money' }
        total_usd: { $ref: '#/components/schemas/Money' }
        total_khr: { $ref: '#/components/schemas/Riel' }
        coupon_code: { type: string, nullable: true }
        offer:
          type: object
          nullable: true
          description: The automatic offer used, copied at order time (id becomes null if the offer is deleted later).
          properties:
            id: { type: integer, nullable: true }
            name: { type: string, example: Buy 2 Sherlock Holmes }
            min_quantity: { type: integer, example: 2 }
            percent_off: { type: string, example: '15.00' }
        shipping_address: { $ref: '#/components/schemas/AddressInput' }
        can_cancel: { type: boolean }
        delivery_note: { type: string, maxLength: 300, nullable: true }
        is_gift: { type: boolean, description: 'Free gift option (no fee). The packing sheet hides prices.' }
        gift_message: { type: string, maxLength: 200, nullable: true }
        is_free_shipping: { type: boolean }
        estimated_delivery: { $ref: '#/components/schemas/EstimatedDelivery', nullable: true }
        status_history:
          type: array
          items: { type: object, properties: { status: { type: string }, note: { type: string, nullable: true }, created_at: { type: string, format: date-time } } }
    OrderDocument:
      type: object
      description: 'What an invoice or packing slip prints. KHR uses the rate in force when the order was placed (null when no rate was set then), so a reprint never changes.'
      properties:
        credit_used_usd: { $ref: '#/components/schemas/Money' }
        payment_due_usd: { $ref: '#/components/schemas/Money' }
        free_gift: { $ref: '#/components/schemas/FreeGift' }
        id: { type: integer }
        order_number: { type: string, example: ORD-20261003-7K2QX }
        status: { type: string, enum: [pending, paid, processing, shipped, delivered, cancelled, returned] }
        placed_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        delivery_note: { type: string, maxLength: 300, nullable: true }
        is_gift: { type: boolean, description: 'Free gift option (no fee). The packing sheet hides prices.' }
        gift_message: { type: string, maxLength: 200, nullable: true }
        payment_method: { type: string, enum: [card, cod, khqr] }
        payment_status: { type: string, enum: [pending, succeeded, failed, refunded], nullable: true }
        customer: { type: object, properties: { name: { type: string }, email: { type: string, nullable: true }, phone: { type: string, nullable: true } } }
        shipping_address: { $ref: '#/components/schemas/AddressInput' }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              title: { type: string }
              authors: { type: array, items: { type: string } }
              format: { type: string, enum: [hardcover, paperback, ebook, audiobook] }
              is_digital: { type: boolean }
              sku: { type: string }
              isbn: { type: string, nullable: true }
              quantity: { type: integer }
              unit_price_usd: { $ref: '#/components/schemas/Money' }
              subtotal_usd: { $ref: '#/components/schemas/Money' }
        subtotal_usd: { $ref: '#/components/schemas/Money' }
        discount_usd: { $ref: '#/components/schemas/Money' }
        coupon_code: { type: string, nullable: true }
        shipping_fee_usd: { $ref: '#/components/schemas/Money' }
        tax_usd: { $ref: '#/components/schemas/Money' }
        total_usd: { $ref: '#/components/schemas/Money' }
        refunded_usd: { $ref: '#/components/schemas/Money' }
        amount_to_collect_usd: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'What the courier collects: the total for an unpaid cash-on-delivery order, else 0.00' }
        khr:
          type: object
          nullable: true
          properties:
            rate: { type: string, example: '4100.000000' }
            rate_effective_at: { type: string, format: date-time }
            total: { $ref: '#/components/schemas/Riel' }
            amount_to_collect: { $ref: '#/components/schemas/Riel' }
    Return:
      type: object
      properties:
        credit_refund_usd: { $ref: '#/components/schemas/Money' }
        external_refund_usd: { type: string, nullable: true }
        id: { type: integer }
        order_id: { type: integer }
        order_number: { type: string }
        status: { type: string, enum: [requested, approved, rejected, refunded] }
        reason: { type: string }
        items:
          type: array
          items: { type: object, properties: { id: { type: integer }, order_item_id: { type: integer }, title: { type: string }, format: { type: string }, quantity: { type: integer }, unit_price_usd: { $ref: '#/components/schemas/Money' }, reason: { type: string, nullable: true } } }
        refund_amount_usd: { $ref: '#/components/schemas/Money' }
        is_refund_final: { type: boolean, description: false while the amount is an estimate }
        refund_method: { type: string, nullable: true, enum: [cash, bank_transfer, store_credit], description: null before the refund and for refunds made before methods were recorded }
        refund_reference: { type: string, nullable: true, description: bank transfer reference }
        refunded_at: { type: string, format: date-time, nullable: true }
        store_credit: { type: object, nullable: true, properties: { code: { type: string }, amount_usd: { $ref: '#/components/schemas/Money' }, expires_at: { type: string, format: date-time } } }
        staff_note: { type: string, nullable: true }
        requested_at: { type: string, format: date-time }
        resolved_at: { type: string, format: date-time, nullable: true }
        can_withdraw: { type: boolean }
    BookImportRow:
      type: object
      properties:
        row_number: { type: integer, description: 'Data rows start at 2 (row 1 is the header)' }
        action: { type: string, enum: [new, update, error] }
        title: { type: string }
        format: { type: string }
        sku: { type: string }
        messages: { type: array, items: { type: string } }
    Review:
      type: object
      properties:
        id: { type: integer }
        book_id: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        comment: { type: string, nullable: true }
        reviewer_name: { type: string, example: Sok D. }
        verified_purchase: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    OwnReview:
      allOf:
        - $ref: '#/components/schemas/Review'
        - type: object
          properties:
            book: { type: object, properties: { id: { type: integer }, title: { type: string } } }
            is_visible: { type: boolean, description: false when staff have hidden the review }

    StockAlert:
      type: object
      properties:
        id: { type: integer }
        book_variant_id: { type: integer }
        created_at: { type: string, format: date-time }
        notified_at: { type: string, format: date-time, nullable: true }
        book:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            title: { type: string }
            cover_image_url: { type: string, nullable: true }
        variant:
          type: object
          nullable: true
          properties:
            id: { type: integer }
            format: { type: string }
            price_usd: { type: string }
            stock_quantity: { type: integer }
            is_active: { type: boolean }

    GiftCard:
      type: object
      required: [id, amount_usd, recipient_name, recipient_email, message, send_on, status, last_four, expires_at, can_reveal, email_sent_at, email_failed_at]
      properties:
        id: { type: integer }
        amount_usd: { type: string }
        recipient_name: { type: string }
        recipient_email: { type: string }
        message: { type: string, nullable: true }
        send_on: { type: string, format: date }
        status: { type: string, enum: [pending_payment, active, redeemed, cancelled, expired] }
        last_four: { type: string, nullable: true }
        expires_at: { type: string, nullable: true }
        can_reveal: { type: boolean }
        email_sent_at: { type: string, nullable: true }
        email_failed_at: { type: string, nullable: true }
    GiftPurchaseInput:
      type: object
      required: [amount_usd, recipient_name, recipient_email, send_on]
      properties:
        amount_usd: { type: string, description: '5.00 through 200.00 USD, at most two decimal places' }
        recipient_name: { type: string, maxLength: 120 }
        recipient_email: { type: string, format: email, maxLength: 190 }
        message: { type: string, nullable: true, maxLength: 300, description: 'Plain text, escaped on display' }
        send_on: { type: string, format: date, description: 'Today through 90 days ahead in shop timezone' }
    GiftPaymentState:
      type: object
      required: [data, payment]
      properties:
        data: { $ref: '#/components/schemas/GiftCard' }
        payment:
          type: object
          nullable: true
          required: [qr_payload, expires_at, mode]
          properties:
            qr_payload: { type: string }
            expires_at: { type: string }
            mode: { type: string, enum: [test, bakong] }
    ReferralStatus:
      type: string
      enum: [pending, qualified, rewarded, void]
    ReferralSummary:
      type: object
      required: [code, friend_discount_usd, reward_usd, balance_usd, history, current_page, last_page]
      properties:
        code: { type: string }
        friend_discount_usd: { type: string }
        reward_usd: { type: string }
        balance_usd: { type: string }
        current_page: { type: integer }
        last_page: { type: integer }
        history:
          type: array
          items:
            type: object
            required: [id, status, reward_cents, created_at, rewarded_at]
            properties:
              id: { type: integer }
              status: { $ref: '#/components/schemas/ReferralStatus' }
              reward_cents: { type: integer }
              created_at: { type: string }
              rewarded_at: { type: string, nullable: true }

security:
  - bearer: []

paths:
  /shop/features:
    get:
      tags: [Public]
      security: []
      summary: 'Available optional money features; both disabled by default'
      responses:
        '200':
          description: Feature flags
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    required: [gift_cards, referrals]
                    properties:
                      gift_cards: { type: boolean }
                      referrals: { type: boolean }
  /me/gift-cards:
    get:
      tags: [Customer]
      summary: 'Buyer purchases and wallet balance, 20 per page; verified non-demo customers only'
      responses:
        '200':
          description: Purchases
          content:
            application/json:
              schema:
                type: object
                required: [data, balance_usd, current_page, last_page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/GiftCard' } }
                  balance_usd: { type: string }
                  current_page: { type: integer }
                  last_page: { type: integer }
        '404': { description: Feature disabled }
    post:
      tags: [Customer]
      summary: 'Create an unpaid USD KHQR purchase; no credit funding or simulated activation'
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 100 } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/GiftPurchaseInput' } } } }
      responses:
        '201': { description: 'Pending purchase (same buyer/key/details replays existing purchase)', content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/GiftCard' } } } } } }
        '422': { description: Invalid details or purchase unavailable }
        '404': { description: Feature disabled }
  /me/gift-cards/{id}/payment:
    get:
      tags: [Customer]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      summary: 'Buyer-only verified payment polling, 20/min; late payments require staff refund review'
      responses:
        '200': { description: Payment state, content: { application/json: { schema: { $ref: '#/components/schemas/GiftPaymentState' } } } }
        '404': { description: Disabled or not owned }
  /me/gift-cards/{id}/reveal:
    post:
      tags: [Customer]
      parameters: [{ $ref: '#/components/parameters/Id' }]
      summary: 'Reveal active code exactly once; response is never cached'
      responses:
        '200': { description: Code, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { code: { type: string } } } } } } } }
        '422': { description: Already shown or not active }
        '404': { description: Disabled or not owned }
  /me/gift-cards/redeem:
    post:
      tags: [Customer]
      summary: 'Single-use redemption to wallet; 5/min/customer, 20/hour/IP and one-hour lock after ten failures'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [gift_code], properties: { gift_code: { type: string, maxLength: 64, writeOnly: true } } } } } }
      responses:
        '200': { description: New balance, content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { balance_usd: { type: string } } } } } } } }
        '422': { description: 'Generic failure; no validity/status disclosure' }
        '429': { description: Rate limited }
        '404': { description: Feature disabled }
  /me/referrals:
    get:
      tags: [Customer]
      summary: 'Email-verified non-demo customer referral code and paged status list; no friend personal data'
      parameters: [{ name: X-Bookly-Device, in: header, schema: { type: string, maxLength: 64 } }]
      responses:
        '200': { description: Referrals, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/ReferralSummary' } } } } } }
        '404': { description: Feature disabled }
  /staff/gift-cards:
    get:
      tags: [Admin]
      summary: 'Admin-only paged cards and funding/redeemed/unredeemed/refund-review totals; code hashes omitted'
      parameters:
        - { name: last_four, in: query, schema: { type: string, minLength: 4, maxLength: 4 } }
        - { name: buyer_id, in: query, schema: { type: integer } }
        - { name: status, in: query, schema: { type: string, enum: [pending_payment, active, redeemed, cancelled, expired] } }
      responses:
        '200': { description: 'Paged card records and totals (amounts in USD)' }
