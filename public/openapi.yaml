  /demo/token:
    post:
      tags: [Public]
      summary: 'One-click demo sign-in: a 2-hour customer token for the shared demo account (10 per hour per IP)'
      description: |
        Used by the **Sign in as demo customer** button on this page. No password needed and no way to choose the account:
        it only ever signs in `demo@bookly.test`. The demo account can't change its password, email or linked logins, write reviews or
        connect Telegram order updates. Every hour it is tidied: name and password restored, cart emptied, visitor addresses removed
        (only its sample address stays), Telegram unlinked, and pending orders older than an hour cancelled.
        Real sign-ins use `POST /auth/login` (with the bot check when enabled).
      security: []
      responses:
        '200':
          description: Token for the demo customer
          content:
            application/json:
              example: { customer: { id: 1, name: Demo Customer, email: demo@bookly.test }, token: '12|abc…', token_type: Bearer, expires_at: '2026-10-30T12:00:00+00:00' }
        '404': { description: The demo account is not set up on this server }
        '429': { description: Too many demo sign-ins from this IP (10 per hour) }
