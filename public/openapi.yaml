      summary: 'The KHQR in USD or KHR (made on first ask; the KHR amount is fixed at that time); 10/min'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [currency], properties: { currency: { type: string, enum: [USD, KHR] } } } } } }
      responses:
        '200': { description: Payment state (KhqrPayment) }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: 'Not waiting for payment, or no exchange rate for KHR' }
  /orders/{id}/payment/simulate:
    post:
      tags: [Checkout & orders]
      summary: 'Test mode only: pays the waiting QR with no real money (404 in bakong mode); 10/min'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: 'Payment state (KhqrPayment), status paid' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { description: Not waiting for payment }
  /orders/{id}/reorder:
    post:
      tags:
      - Checkout & orders
      summary: 'Buy again: add the order items to the cart (items that cannot be bought now are skipped with a reason; when fewer copies are left, what is left is added with a note); 10/min'
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: data.added (book_variant_id, title, quantity added, requested_quantity from the order, note when fewer were added, else null), data.skipped (book_variant_id, title, reason), data.cart (Cart)
          content:
            application/json:
              example:
                data:
                  added:
                  - book_variant_id: 1
                    title: Pride and Prejudice
                    quantity: 1
                    requested_quantity: 3
                    note: Only 1 left in stock.
                  skipped:
                  - book_variant_id: 23
                    title: Treasure Island
                    reason: This item is out of stock.
                  cart:
                    id: 4
                    items:
                    - id: 28
                      book_variant_id: 1
                      book:
                        id: 1
                        title: Pride and Prejudice
                      format: paperback
                      quantity: 1
                      unit_price_usd: '12.99'
                      unit_price_khr: '53259'
                      line_total_usd: '12.99'
                      line_total_khr: '53259'
                      issues: []
                    item_count: 1
                    subtotal_usd: '12.99'
                    subtotal_khr: '53259'
                    can_checkout: true
        '404':
          $ref: '#/components/responses/NotFound'
  /orders/{id}/invoice:
    get: { tags: [Checkout & orders], summary: 'Print data for your invoice (not for a cancelled order)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Invoice data, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/OrderDocument' } } } } } }, '404': { $ref: '#/components/responses/NotFound' }, '422': { description: Cancelled order } } }
  /orders/{id}/returnable-items:
