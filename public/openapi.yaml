        schema:
          type: integer
      - name: author_id
        in: query
        schema:
          type: integer
      - name: series_id
        in: query
        schema:
          type: integer
      - name: publisher_id
        in: query
        schema:
          type: integer
      - name: format
        in: query
        schema:
          type: string
          enum:
          - hardcover
          - paperback
          - ebook
          - audiobook
      - name: language
        in: query
        schema:
          type: string
      - name: min_price
        in: query
        schema:
          type: number
      - name: max_price
        in: query
        schema:
          type: number
      - name: in_stock
        in: query
        schema:
          type: boolean
      - { name: 'category_ids[]', in: query, schema: { type: array, items: { type: integer } }, description: 'Any of these categories (each includes its sub-categories; category_id does too)' }
      - { name: 'formats[]', in: query, schema: { type: array, items: { type: string, enum: [hardcover, paperback, ebook, audiobook] } } }
      - { name: age, in: query, schema: { type: integer, minimum: 0, maximum: 18 }, description: 'Books for a reader of this age (age_min <= age <= age_max)' }
      - { name: school_grade, in: query, schema: { type: integer, minimum: 1, maximum: 12 } }
      - { name: level, in: query, schema: { type: string, enum: [A1, A2, B1, B2, C1, C2] } }
      - { name: has_ebook, in: query, schema: { type: boolean } }
      - { name: coming_soon, in: query, schema: { type: boolean }, description: 'At least one active format has a future release_date' }
      - { name: facets, in: query, schema: { type: boolean }, description: 'Adds `facets` {formats, languages, categories (top-level id), school_grades, levels, with_age} = book counts with the other filters applied' }
      - name: sort
        in: query
        schema:
          type: string
          enum:
          - relevance
          - newest
          - price_asc
          - price_desc
          - best_selling
          - most_reviewed
          - release_soon
          - title
          - rating
      - name: ids
        in: query
        description: Comma-separated IDs or array (max 12); keeps order and drops missing/hidden books
        schema:
          type: string
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated book cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BookCard'
                  links:
                    $ref: '#/components/schemas/PageLinks'
                  meta:
                    $ref: '#/components/schemas/PageMeta'
              example:
                data:
                - id: 1
                  title: Pride and Prejudice
                  language: English
                  authors:
                  - id: 1
                    name: Jane Austen
                  cover_image_url: https://picsum.photos/seed/bookly-1/400/600
                  price_from_usd: '8.99'
                  price_from_khr: '36859'
                  formats:
                  - hardcover
                  - ebook
                  - paperback
                  in_stock: true
                  rating_avg: 5
                  review_count: 1
                meta:
                  current_page: 1
                  last_page: 1
                  per_page: 20
                  total: 1
        '422':
          $ref: '#/components/responses/Validation'
      description: 'Public, no token needed. Full-text search (`q`) matches every word as a prefix across title, description, authors, series and
        categories. Paginated: `data`, `links`, `meta`.'
