  /auth/register:
    post:
      tags:
      - Customer auth
      summary: Create an account; confirm it with an email code, or with your phone number in the Telegram bot (verify_by)
      description: verify_by=telegram needs GET /auth/options telegram=true (else 422 on verify_by); the email is then optional; a typed email is
        not saved yet but gets an email-change code (pending_email in the answer) and is added by POST /me/email/verify; the website continues with
        POST /auth/telegram/phone, and the number shared in the bot verifies the account (it then signs in with Continue with Telegram). If the
        email belongs to a sign-up that was never verified, an email sign-up takes that account over (new name and password, its old sessions and
        codes cancelled); an unproven copy of the email on a phone account is taken off it. Forgot/reset password is refused for such an unproven
        email. Sign-ups still unverified after UNVERIFIED_CUSTOMER_HOURS (48) are deleted. An account with a proven email, or a deactivated or deleted
        one, keeps its email (422).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - password
              - password_confirmation
              properties:
                referral_code: { type: string, maxLength: 16 }
                referral_device: { type: string, maxLength: 64 }
                name:
                  type: string
                email:
                  type: string
                  format: email
                  description: Required unless verify_by=telegram
                password:
                  type: string
                  minLength: 8
                  description: Letters and numbers
                password_confirmation:
                  type: string
                phone:
                  type: string
                  description: Contact number for email sign-ups; ignored with verify_by=telegram (the bot gives the proven number)
                verify_by:
                  type: string
                  enum:
                  - email
                  - telegram
                  default: email
                turnstile_token:
                  type: string
                  description: Cloudflare Turnstile token; required once TURNSTILE_SECRET_KEY is set
            example:
              name: Sok Dara
              email: dara@example.com
              password: a-long-passphrase
              password_confirmation: a-long-passphrase
      responses:
        '201':
          description: Account + token + verify_by. Shopping routes return 403 until the account is confirmed.
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/TokenResponse'
                - type: object
                  properties:
                    customer:
                      $ref: '#/components/schemas/Customer'
                    message:
                      type: string
                    verify_by:
                      type: string
                      enum:
                      - email
                      - telegram
        '422':
          $ref: '#/components/responses/Validation'
  /auth/options:
    get: { tags: [Customer auth], summary: 'What sign-up and sign-in can offer: telegram is true once TELEGRAM_BOT_TOKEN is set', security: [], responses: { '200': { description: Options, content: { application/json: { schema: { type: object, properties: { telegram: { type: boolean } } } } } } } }
  /auth/login:
    post:
      tags:
      - Customer auth
      summary: Log in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                password:
                  type: string
                turnstile_token:
                  type: string
                  description: Cloudflare Turnstile token; required once TURNSTILE_SECRET_KEY is set
            example:
              email: demo@bookly.test
              password: Password123!
      responses:
        '200':
          description: Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
              example:
                customer:
                  id: 1
                  name: Demo Customer
                  email: demo@bookly.test
                  email_verified: true
                  verified: true
                  has_password: true
                  locale: en
                token: 10|FYJNQVFV2…
                token_type: Bearer
                expires_at: '2026-11-06T07:33:58+00:00'
        '401':
          description: Wrong email or password
          content:
            application/json:
              example:
                message: Invalid email or password.
        '403':
          description: Account deactivated
        '429':
          description: Too many attempts
      description: 'Returns a customer Bearer token (valid 7 days) with the `customer` ability. Send it as `Authorization: Bearer <token>`. Wrong
        credentials and rate limits answer with JSON, never a redirect.
  
  
        **Try it:** use the *Sign in as demo customer* button at the top of `/docs` (no password needed).'
  /auth/social/{provider}:
    post:
      tags: [Customer auth]
      summary: Log in with a Google or Facebook access token
      description: 'Signs in the account already linked to this Google/Facebook id, or creates one. An email proven on another account (or on a closed one) is refused with 409 (an unproven copy on a phone account is taken off it instead) and told how to sign in instead; an unfinished sign-up with that email becomes the social account (its password and sessions are removed). A new Facebook account confirms a phone number in the Telegram bot, or gives an email: without verify_by the answer is 422 with needs=phone, profile {name, email} and telegram (bot on); call again with the same access_token, verify_by (telegram or email), the email (optional with telegram; unless it is the Facebook email it is not saved yet but gets a code, pending_email in the answer) and turnstile_token. verify_by in the response says what is next: telegram (POST /auth/telegram/phone), email (a code was sent) or null (Facebook confirmed the email).'
      security: []
      parameters: [ { name: provider, in: path, required: true, schema: { type: string, enum: [google, facebook] } } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [access_token], properties: { access_token: { type: string }, verify_by: { type: string, enum: [telegram, email], description: 'Facebook sign-up only' }, email: { type: string, description: 'Facebook sign-up only; required with verify_by=email' }, turnstile_token: { type: string } } } } } }
      responses: { '200': { description: Existing account }, '201': { description: New account }, '401': { description: Provider rejected the token }, '409': { description: 'The email already has an account: sign in as before' }, '422': { description: 'needs=phone (Facebook sign-up), the email is missing or taken, or Telegram is off' } }
  /auth/logout:
    post: { tags: [Customer auth], summary: 'Revoke the current token', responses: { '200': { description: Logged out } } }
  /auth/verify-email:
    post: { tags: [Customer auth], summary: 'Verify the email with the 6-digit code', requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }, responses: { '200': { description: Verified }, '422': { description: Wrong or expired code } } }
  /auth/resend-verification:
    post: { tags: [Customer auth], summary: 'Send a new email verification code (3 per 10 min per visitor; 422 without an email)', requestBody: { content: { application/json: { schema: { type: object, properties: { turnstile_token: { type: string } } } } } }, responses: { '200': { description: Sent }, '422': { $ref: '#/components/responses/Validation' } } }
  /auth/forgot-password:
    post: { tags: [Customer auth], summary: 'Email a reset code (same answer whether the email exists or not)', security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string }, turnstile_token: { type: string } } } } } }, responses: { '200': { description: OK } } }
  /auth/telegram:
    post:
      tags: [Customer auth]
      summary: Continue with Telegram (sign in), step 1
      security: []
      description: 'Makes a one-time link (10 minutes). Open `url` (t.me/<bot>?start=<code>), tap "Share my phone number" in the bot, then poll POST /auth/telegram/status with `key`. Signs in the active account that proved that +855 number. 10 links per 10 minutes per visitor.'
      responses: { '201': { description: 'url, key (keep it private), expires_at' }, '429': { description: Too many links }, '503': { description: 'The bot is off' } }
  /auth/telegram/phone:
    post:
      tags: [Customer auth]
      summary: Confirm or change your phone number with Telegram
      description: 'Same as POST /auth/telegram, for the signed-in customer: the number shared in the bot becomes the account''s verified number (and contact number), which also verifies a new account. Refused in the bot and in the status when another account (also a closed one) has the number.'
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { password: { type: string, description: 'Verified accounts with a password: required (a new number is a new way in)' } } } } } }
      responses: { '201': { description: 'url, key, expires_at' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: 'reason=sign_in_again: a verified account without a password signed in more than 10 minutes ago' }, '422': { $ref: '#/components/responses/Validation' }, '503': { description: 'The bot is off' } }
  /auth/telegram/order-updates:
    post:
      tags: [Customer auth]
      summary: Connect Telegram for real-time order updates
      description: 'Generates a one-time link (10 minutes). Open `url` (t.me/<bot>?start=<code>) and tap Start. The bot links your Telegram chat to receive instant order placed, packing, shipping, and delivery notifications.'
      responses: { '201': { description: 'url, key, expires_at' }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { description: "The shared demo account (a visitor's chat would get every other visitor's order updates)" }, '503': { description: 'The bot is off' } }
  /auth/telegram/status:
    post:
      tags: [Customer auth]
      summary: How a Telegram link went (the website asks every few seconds)
      security: []
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [key], properties: { key: { type: string } } } } } }
      responses: { '200': { description: 'status pending | failed (message says why: no account with this number, number on another account, not +855, deactivated) | done (customer; plus token and expires_at for a sign-in, handed out once)' }, '404': { description: 'Unknown key, or the link expired' } }
  /auth/phone/code:
    post:
      tags: [Customer auth]
      summary: Send a sign-in code to a phone number through the Bookly Telegram bot
      security: []
      description: 'Works for numbers whose owner opened the Bookly bot before (signed in or confirmed the number with Telegram); others use POST /auth/telegram once. Always the same 202 answer, whether or not the number belongs to an account, so the page cannot be used to find out who shops at Bookly (the code is made and sent after the response). Limits: per number 1 a minute and 5 an hour; per IP 10 per 10 minutes; Turnstile when on.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone], properties: { phone: { type: string, example: '012 345 678' }, turnstile_token: { type: string } } } } } }
      responses: { '202': { description: 'message, expires_in_minutes (10)' }, '422': { description: 'Not a Cambodian (+855) number' }, '429': { description: 'Too many codes for this number or device (Retry-After)' }, '503': { description: 'The Telegram bot is off' } }
  /auth/phone/verify:
    post:
      tags: [Customer auth]
      summary: Sign in with the phone number and the code from Telegram
      security: []
      description: 'Codes last 10 minutes; a new code cancels the old one; 5 wrong guesses throw a code away. On success the bot confirms the sign-in in the chat with a "Sign me out everywhere" button (24 hours), and a verified email gets a security notice.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [phone, code], properties: { phone: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses: { '200': { description: 'customer, token, token_type, expires_at' }, '422': { description: 'Wrong or expired code (same answer for an unknown number)' }, '429': { description: 'Too many guesses (5 a minute per number and IP)' } }
  /auth/reset-password:
    post: { tags: [Customer auth], summary: 'Set a new password with the code (signs out everywhere)', security: [], requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { email: { type: string }, code: { type: string }, password: { type: string }, password_confirmation: { type: string } } } } } }, responses: { '200': { description: Reset }, '422': { description: Wrong or expired code } } }
  /me/export:
    get:
      tags: [Customer]
      summary: 'Download my data: one JSON file with everything your account shows (5 per hour)'
      description: |
        Profile, addresses, cart, wishlist, orders (with status history), returns, reviews, stock alerts, store credits and
        newsletter status. Sent as a file download (`Content-Disposition: attachment`). Internal data (password hash,
        tokens, staff notes and tags) is never included.
      responses:
        '200':
          description: The export file
          content:
            application/json:
              example: { exported_at: '2026-10-30T10:00:00+07:00', profile: { id: 1, name: Sok Dara, email: dara@example.com }, addresses: [], cart: { items: [] }, wishlist: [], orders: [], returns: [], reviews: [], stock_alerts: [], store_credits: [], newsletter: { status: none } }
        '401': { description: Not signed in }
        '429': { description: More than 5 exports in an hour }
  /me:
    get: { tags: [Customer], summary: 'Your profile', responses: { '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' }, '200': { description: Customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } } } }
    patch:
      tags: [Customer]
      summary: 'Update name, phone, locale (en|km), Telegram order updates or price-drop emails'
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string, maxLength: 150 }, phone: { type: string, nullable: true, maxLength: 30 }, locale: { type: string, enum: [en, km] }, telegram_order_updates: { type: boolean }, price_drop_alerts: { type: boolean }, cart_reminders: { type: boolean } } } } } }
      responses: { '200': { description: Updated, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }, '422': { $ref: '#/components/responses/Validation' } }
    delete:
      tags: [Customer]
      summary: Close your own account
      description: 'Confirm with the password, or (accounts without one) a fresh Google/Facebook access token for the linked account, plus confirm=DELETE. Refused while an order is on its way or a return is open. Signs out everywhere, removes reviews, wishlist and cart, and hides the account; personal details are erased after CLOSED_ACCOUNT_DAYS (30) by customers:erase-closed. Orders and returns are kept.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [confirm], properties: { confirm: { type: string, enum: [DELETE] }, password: { type: string }, provider: { type: string, enum: [google, facebook] }, access_token: { type: string } } } } } }
      responses: { '200': { description: 'Closed; erase_at says when the details are erased' }, '422': { $ref: '#/components/responses/Validation' } }
  /me/telegram:
    delete:
      tags: [Customer]
      summary: Disconnect Telegram and disable order updates
      responses: { '200': { description: Customer, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/Customer' } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /me/password:
    put: { tags: [Customer], summary: 'Change password (signs out other devices)', description: 'A first password (account without one) needs a sign-in in the last 10 minutes.', responses: { '200': { description: Changed }, '403': { description: 'reason=sign_in_again' }, '422': { $ref: '#/components/responses/Validation' } } }
  /me/email:
    post:
      tags: [Customer]
      summary: Add or change your email (step 1, code to the new address)
      description: 'The password is required when the account has one. Nothing changes until the code comes back (step 2). Refused when another account (also a closed one) uses the address, or it is already yours. At most 5 codes an hour per account, plus the otp-send limit and Turnstile.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string, format: email }, password: { type: string }, turnstile_token: { type: string } } } } } }
      responses: { '200': { description: 'Code sent; email is the address it went to' }, '403': { description: 'reason=sign_in_again: no password and the last sign-in is more than 10 minutes old' }, '422': { $ref: '#/components/responses/Validation' } }
  /me/email/verify:
    post:
      tags: [Customer]
      summary: Confirm the new email with its code (step 2)
      description: 'Saves the address as verified, cancels codes sent to the old address, signs out other devices, and tells the old address (if it was proven) about the change.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, pattern: '^[0-9]{6}$' } } } } } }
      responses: { '200': { description: 'Saved (customer in the body)' }, '422': { description: 'Wrong or expired code, or the address was taken meanwhile' } }
  /me/connections/{provider}:
    post:
      tags: [Customer]
      summary: Connect Google or Facebook to your account
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      description: 'A fresh access token from the provider (checked as issued to our app; the profile is read from the provider) plus the password when the account has one. The provider account must not be linked to another Bookly account. A verified email gets a notice.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [access_token], properties: { access_token: { type: string }, password: { type: string } } } } } }
      responses: { '200': { description: 'Connected (customer in the body)' }, '403': { description: 'reason=sign_in_again: no password and the last sign-in is more than 10 minutes old' }, '409': { description: 'Used by another Bookly account, or another account of this provider is connected' }, '422': { description: 'Wrong password, or the token could not be verified (422, not 401, so the session stays)' } }
    delete:
      tags: [Customer]
      summary: Disconnect Google or Facebook
      parameters: [ { $ref: '#/components/parameters/Provider' } ]
      description: 'Refused with reason=last_way_in when it is the only way left to sign in ("Add a password first, so you can still sign in."). A verified email gets a notice.'
      responses: { '200': { description: 'Disconnected (customer in the body)' }, '422': { description: 'It is the last way in' } }
  /me/sessions:
    get:
      tags: [Customer]
      summary: Where you're signed in (one entry per signed-in device)
      description: 'Device is read from the browser ("Chrome on Windows"; null for sign-ins saved before 2026-11-04). The shared demo account only sees its own session.'
      responses:
        '200':
          description: Signed-in devices, most recently used first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        device: { type: string, nullable: true }
                        ip_address: { type: string, nullable: true }
                        signed_in_at: { type: string, format: date-time, nullable: true }
                        last_used_at: { type: string, format: date-time, nullable: true }
                        expires_at: { type: string, format: date-time, nullable: true }
                        is_current: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/sessions/sign-out-others:
    post:
      tags: [Customer]
      summary: Sign out of every other device (keeps this one)
      responses:
        '200': { description: 'Done; signed_out = how many devices were signed out' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The shared demo account }
  /me/sessions/{id}:
    delete:
      tags: [Customer]
      summary: Sign out of one other device
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { description: Signed out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: The shared demo account }
        '404': { description: 'Not one of your devices, or already signed out' }
        '422': { description: 'This device (use POST /auth/logout)' }
  /me/store-credits:
    get:
      tags: [Customer]
      summary: Store credits of the signed-in customer (refunds paid as a coupon)
      description: 'Newest first, including used and expired ones.'
      responses:
        '200':
          description: Store credits
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        code: { type: string, example: CREDIT-K7M2Q9XA }
                        amount_usd: { $ref: '#/components/schemas/Money' }
                        expires_at: { type: string, format: date-time, nullable: true }
                        used: { type: boolean }
                        expired: { type: boolean }
                        created_at: { type: string, format: date-time }
  /me/stock-alerts:
    get:
      tags: [Customer]
      summary: Active and past stock alerts for the signed-in customer
      responses:
        '200':
          description: Stock alerts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StockAlert'
    post:
      tags: [Customer]
      summary: Subscribe to back-in-stock alert for a physical variant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_variant_id]
              properties:
                book_variant_id: { type: integer, example: 1 }
      responses:
        '201':
          description: Alert created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/StockAlert' }
        '422': { $ref: '#/components/responses/Validation' }
  /me/stock-alerts/{id}:
    delete:
      tags: [Customer]
      summary: Delete a stock alert
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  /addresses:
    get: { tags: [Customer], summary: 'Saved addresses (default first)', responses: { '200': { description: Addresses, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Address' } } } } } } } } }
    post: { tags: [Customer], summary: 'Add an address (max 10; first one is default)', requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AddressInput' } } } }, responses: { '201': { description: Created } } }
  /addresses/{id}:
    patch: { tags: [Customer], summary: 'Update; is_default: true moves the default', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated } } }
    delete: { tags: [Customer], summary: 'Delete (the newest remaining becomes default)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { $ref: '#/components/responses/NoContent' } } }
  /cart:
    get:
      tags:
      - Customer
      summary: Cart with current prices and per-line issues
      responses:
        '200':
          description: Cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Cart'
              example:
                data:
                  id: 4
                  items:
                  - id: 28
                    book_variant_id: 1
                    book:
                      id: 1
                      title: Pride and Prejudice
                    format: paperback
                    quantity: 1
                    unit_price_usd: '12.99'
                    unit_price_khr: '53259'
                    line_total_usd: '12.99'
                    line_total_khr: '53259'
                    issues: []
                    in_offer: false
                  item_count: 1
                  subtotal_usd: '12.99'
                  subtotal_khr: '53259'
                  can_checkout: true
                  pricing:
                    subtotal_usd: '12.99'
                    subtotal_khr: '53259'
                    discount_usd: '0.00'
                    discount_khr: '0'
                    total_before_shipping_usd: '12.99'
                    total_before_shipping_khr: '53259'
                    offer: null
                    nudge: { offer_id: 3, add_quantity: 1, percent_off: '10.00', target_label: null }
                    free_shipping: { threshold_usd: '50.00', threshold_khr: '205000', amount_needed_usd: '37.01', amount_needed_khr: '151741', is_free: false }
      description: Needs a verified customer token. Prices are always today's; a line whose price, stock or availability changed since it was added
        carries an `issues` entry instead of changing silently. `pricing` adds the automatic offer (discount, which lines,
        a nudge such as "add 1 more to save 10%") and the free-delivery numbers from the API.
    delete:
      tags:
      - Customer
      summary: Empty the cart
      responses:
        '200':
          description: Empty cart
  /cart/items:
    post:
      tags:
      - Customer
      summary: Add a format (same format again increases quantity; max 10; ebooks/audiobooks 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - book_variant_id
              properties:
                book_variant_id:
                  type: integer
                quantity:
                  type: integer
                  default: 1
            example:
              book_variant_id: 1
              quantity: 1
      responses:
        '201':
          description: Cart
          content:
            application/json:
              example:
                data:
                  id: 4
                  items:
                  - id: 28
                    book_variant_id: 1
                    book:
                      id: 1
                      title: Pride and Prejudice
                    format: paperback
                    quantity: 1
                    unit_price_usd: '12.99'
                    unit_price_khr: '53259'
                    line_total_usd: '12.99'
                    line_total_khr: '53259'
                    issues: []
                  item_count: 1
                  subtotal_usd: '12.99'
                  subtotal_khr: '53259'
                  can_checkout: true
        '422':
          description: Not available, out of stock or over the limit
          content:
            application/json:
              example:
                message: This item is out of stock.
                errors:
                  quantity:
                  - This item is out of stock.
  /cart/items/{id}:
    patch: { tags: [Customer], summary: 'Set quantity', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Cart } } }
    delete: { tags: [Customer], summary: 'Remove a line', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Cart } } }
  /cart/coupon/check:
    post: { tags: [Customer], summary: 'Preview a coupon against the cart (10/min)', requestBody: { required: true, content: { application/json: { schema: { type: object, properties: { code: { type: string } } } } } }, responses: { '200': { description: Discount preview, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CouponCheck' } } } } } }, '422': { description: 'Invalid, expired, used up, minimum not met or already used by you' } } }
  /cart/series/{id}:
    post:
      tags: [Customer]
      summary: 'Add missing series volumes to cart ("Complete the set")'
      description: 'Adds cheapest in-stock physical variant for every volume in the series that the customer does not own and is not already in cart.'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Missing volumes added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      added:
                        type: array
                        items:
                          type: object
                          properties:
                            book_id: { type: integer }
                            title: { type: string }
                            variant_id: { type: integer }
                            format: { type: string }
                            price_usd: { $ref: '#/components/schemas/Money' }
                      skipped:
                        type: array
                        items:
                          type: object
                          properties:
                            book_id: { type: integer }
                            title: { type: string }
                            reason: { type: string, enum: [already_owned, already_in_cart, out_of_stock] }
                      cart:
                        $ref: '#/components/schemas/Cart'
  /wishlist:
    get:
      tags: [Customer]
      summary: 'Saved books (newest first, filterable by reading status)'
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [want_to_read, reading, finished] }
          description: Optional reading status filter
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Book cards with reading status and category counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - { $ref: '#/components/schemas/BookCard' }
                        - type: object
                          properties:
                            wishlist_status: { type: string, enum: [want_to_read, reading, finished] }
                            wishlist_saved_at: { type: string, format: date-time, nullable: true }
                            wishlist_saved_price_usd: { type: string, nullable: true, description: 'Lowest price when the book was saved (null for saves before 2026-11-04); the wishlist shows "Now …, was …" when price_from_usd is lower' }
                  links: { $ref: '#/components/schemas/PageLinks' }
                  meta: { $ref: '#/components/schemas/PageMeta' }
    post:
      tags: [Customer]
      summary: 'Save a book with optional reading status'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id: { type: integer }
                status: { type: string, enum: [want_to_read, reading, finished] }
      responses:
        '201': { description: Added }
        '200': { description: Already saved }
  /wishlist/{id}:
    patch:
      tags: [Customer]
      summary: 'Update reading status for a saved book'
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [want_to_read, reading, finished] }
      responses:
        '200': { description: Status updated }
        '404': { description: Book not found in wishlist }
    delete:
      tags: [Customer]
      summary: 'Remove a book'
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }

  /checkout/preview:
    post: { tags: [Checkout & orders], summary: 'Totals and delivery estimate for the cart', description: 'Saved address_id or default address takes precedence; without one, optional delivery_area selects the existing Phnom Penh/provinces rates and calendar. Does not reserve inventory.', requestBody: { content: { application/json: { schema: { type: object, properties: { use_credit: { type: boolean }, coupon_code: { type: string }, address_id: { type: integer }, delivery_area: { type: string, enum: [phnom_penh, provinces] }, delivery_note: { type: string, maxLength: 300 } } } } } }, responses: { '422': { description: 'Invalid area, address or coupon' }, '200': { description: Totals, content: { application/json: { schema: { type: object, properties: { data: { $ref: '#/components/schemas/CheckoutPreview' } } } } } } } }
  /checkout:
    post:
      tags:
      - Checkout & orders
      summary: Place a cash-on-delivery order from the cart
      description: Prices are re-checked at today's price, stock is taken out of stock, the better of the coupon and the
        automatic offer is applied (never both) and the cart is emptied. Repeating a request with the same Idempotency-Key
        returns the same order (uses are not counted twice).
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 100
        description: New random value per order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - address_id
              - payment_method
              properties:
                expected_payment_due_usd: { type: string, description: 'Required when use_credit is true; reject changed due amount rather than silently charging more' }
                use_credit: { type: boolean, default: false }
                address_id:
                  type: integer
                payment_method:
                  type: string
                  enum:
                  - cod
                coupon_code:
                  type: string
                delivery_note:
                  type: string
                  maxLength: 300
                is_gift:
                  type: boolean
                  description: Free gift option. Default false.
                gift_message:
                  type: string
                  maxLength: 200
                  nullable: true
                  description: Kept only when is_gift is true (trimmed; empty = null).
                offer_id:
                  type: integer
                  description: The offer shown in the preview. If it no longer applies, 422 on offer_id and nothing is placed. Leave it out to accept whatever wins now.
            example:
              address_id: 1
              payment_method: cod
              coupon_code: WELCOME10
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '200':
          description: Same key repeated — the existing order (header Idempotent-Replayed true)
        '422':
          description: Cart empty or has issues, bad address, coupon or key, or offer_id sent and that offer no longer applies (nothing placed)
  /orders:
    get: { tags: [Checkout & orders], summary: 'Your orders (status filter)', responses: { '200': { description: 'Orders (without status_history)', content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/Order' } }, links: { $ref: '#/components/schemas/PageLinks' }, meta: { $ref: '#/components/schemas/PageMeta' } } } } } } } }
  /orders/{id}:
