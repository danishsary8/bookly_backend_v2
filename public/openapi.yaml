  /staff/members/{id}/deactivate:
    post: { tags: [Admin], summary: '(admin) Deactivate', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Deactivated } } }
  /staff/members/{id}/activate:
    post: { tags: [Admin], summary: '(admin) Reactivate', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Active } } }
  /staff/members/{id}/reset-two-factor:
    post: { tags: [Admin], summary: '(admin) Reset 2FA (lost phone)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Reset } } }
  /staff/members/{id}/resend-invitation:
    post: { tags: [Admin], summary: '(admin) Email a new 72 h setup code', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Sent } } }
  /staff/customers/{id}/deactivate:
    post: { tags: [Admin], summary: '(admin) Deactivate a customer', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Deactivated } } }
  /staff/customers/{id}/activate:
    post: { tags: [Admin], summary: '(admin) Reactivate a customer', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Active } } }
  /staff/exchange-rates:
    get: { tags: [Admin], summary: '(admin) USD->KHR rate history', responses: { '200': { description: Rates } } }
    post: { tags: [Admin], summary: '(admin) Set a rate (rate, effective_at?)', responses: { '201': { description: Created } } }
  /staff/audit-logs:
    get: { tags: [Admin], summary: '(admin) Staff changes (staff_user_id, action, entity_type, entity_id, from, to)', responses: { '200': { description: Log entries } } }
  /staff/dashboard/summary:
    get:
      tags: [Admin]
      summary: (admin) Revenue, orders, books and ebook copies sold, best sellers, categories, low stock and previous-period comparison
      parameters:
        - { $ref: '#/components/parameters/Period' }
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: compare, in: query, required: false, description: 'Also return the previous period of the same length and the change in percent (default true)', schema: { type: boolean } }
      responses: { '200': { description: Summary } }
  /staff/dashboard/sales:
    get:
      tags: [Admin]
      summary: (admin) One row per day for charts
      parameters: [ { $ref: '#/components/parameters/Period' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' } ]
      responses: { '200': { description: Daily rows } }
  /staff/dashboard/insights:
    get:
      tags: [Admin]
      summary: (admin) Dashboard extras - daily trends including book and ebook copies, dead stock, stock value, authors, provinces, promotions, repeat customers
      description: 'Daily trends include book and ebook copies. Payment-method totals are non-cancelled placed order amounts, not cash received. Gift orders and cart-reminder recovery are included; recovery only counts sent reminders with a completed seven-day window. The remaining insights include stock, authors, provinces, promotions and returning customers. 5-minute cache.'
      parameters: [ { $ref: '#/components/parameters/Period' }, { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' } ]
      responses: { '200': { description: Insights }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } }
  /staff/dashboard/purchases:
    get:
      tags: [Admin]
      summary: '(admin) Physical stock purchase list, including waiting reservations'
      description: 'Stock is already reduced by checkout reservations. Quantity to buy replenishes net stock to one above the low-stock threshold, without adding waiting quantities twice.'
      parameters:
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Purchase list or CSV
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [book_id, title, variant_id, format, sku, stock_quantity, low_stock_threshold, waiting_quantity, quantity_to_buy]
                      properties:
                        book_id: { type: integer }
                        title: { type: string }
                        variant_id: { type: integer }
                        format: { type: string }
                        sku: { type: string }
                        stock_quantity: { type: integer }
                        low_stock_threshold: { type: integer }
                        waiting_quantity: { type: integer }
                        quantity_to_buy: { type: integer }
            text/csv: { schema: { type: string } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /staff/dashboard/counts:
    get:
      tags: [Staff operations]
      summary: 'Menu badge counts for every staff member: pending_orders, open_returns, low_stock (printed formats at or below their threshold). 60-second cache'
      responses: { '200': { description: 'Counts', content: { application/json: { schema: { type: object, properties: { data: { type: object, properties: { pending_orders: { type: integer }, open_returns: { type: integer }, low_stock: { type: integer } } } } } } } } }
  /staff/orders/export:
    get:
      tags: [Admin]
      summary: (admin) Orders placed in a date range as CSV
      parameters: [ { $ref: '#/components/parameters/From' }, { $ref: '#/components/parameters/To' } ]
      responses: { '200': { description: CSV file, content: { text/csv: { schema: { type: string } } } } }
  /staff/reports/sales:
    get:
      tags: [Admin]
      summary: (admin) Sales report totals and series by day/week/month (format json|csv)
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: group, in: query, required: false, schema: { type: string, enum: [day, week, month], default: day } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Sales report data or CSV stream } }
  /staff/reports/orders:
    get:
      tags: [Admin]
      summary: (admin) Orders breakdown by status, payment method, delivery area, and fulfillment hours
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Orders report data or CSV stream } }
  /staff/reports/products:
    get:
      tags: [Admin]
      summary: (admin) Best sellers, worst sellers with stock, low-stock, and category revenue
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 10 } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Products report data or CSV stream } }
  /staff/reports/customers:
    get:
      tags: [Admin]
      summary: (admin) Verified customer acquisition series, returning rate, and top spenders
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Customers report data or CSV stream } }
  /staff/reports/funnel:
    get:
      tags: [Admin]
      summary: '(admin) Conversion funnel: carts with items -> orders placed -> delivered -> returned'
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Funnel report data or CSV stream } }
  /staff/reports/coupons:
    get:
      tags: [Admin]
      summary: (admin) Coupon usage performance and refunds by return reason
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses: { '200': { description: Coupons and refunds report data or CSV stream } }
  /staff/reports/export:
    get:
      tags: [Admin]
      summary: (admin) Every report for the dates in one Excel file
      description: 'One .xlsx, one sheet per report, same numbers as the JSON reports: Summary, Sales by day, Top books (by revenue, by copies, revenue by category; top 20), Top customers (names and emails: personal data), Orders (by status, payment method, delivery area), Coupons and refunds, Offers. Money is stored as numbers with $ / ៛ formats; text is always a text cell, never a formula. At most 366 days; 10 downloads a minute.'
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
      responses:
        '200':
          description: 'The workbook, as a download named bookly-report-{from}-to-{to}.xlsx'
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
        '429': { description: Too many downloads }
  /staff/reports/offers:
    get:
      tags: [Admin]
      summary: (admin) What each automatic offer sold, next to the orders without an offer
      description: 'Orders placed in the range (shop time zone), not cancelled, not deleted; 5-minute cache. Per offer (grouped by orders.offer_id; current name, or the order copy): orders, units (all books in those orders), units_with_offer (books on discounted lines), revenue (sum of order totals), discount, average_order, books_per_order. without_offer: the same numbers for orders with no offer (coupon orders included). format=csv: one row per offer + "Orders without an offer", UTF-8 BOM.'
      parameters:
        - { $ref: '#/components/parameters/From' }
        - { $ref: '#/components/parameters/To' }
        - { name: format, in: query, required: false, schema: { type: string, enum: [json, csv], default: json } }
      responses:
        '200':
          description: Offers report data or CSV stream
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period: { type: object, properties: { from: { type: string, format: date }, to: { type: string, format: date }, timezone: { type: string } } }
                      offers:
                        type: array
                        items:
                          allOf:
                            - type: object
                              properties:
                                offer_id: { type: integer, nullable: true }
                                name: { type: string }
                                min_quantity: { type: integer, nullable: true }
                                percent_off: { type: string, nullable: true, example: '15.00' }
                            - $ref: '#/components/schemas/OfferReportRow'
                      without_offer: { $ref: '#/components/schemas/OfferReportRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Validation' }
  /newsletter/subscribe:
    post:
      tags: [Newsletter]
      summary: Subscribe to newsletter (sends double opt-in confirmation)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
                locale: { type: string, enum: [en, km] }
                turnstile_token: { type: string }
      responses:
        '202': { description: Confirmation email sent }
  /newsletter/confirm:
    post:
      tags: [Newsletter]
      summary: Confirm newsletter subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Confirmed }
        '422': { description: Invalid token }
  /newsletter/unsubscribe:
    post:
      tags: [Newsletter]
      summary: Unsubscribe from newsletter via web token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        '200': { description: Unsubscribed }
        '422': { description: Invalid token }
  /newsletter/unsubscribe/one-click:
    post:
      tags: [Newsletter]
      summary: RFC 8058 one-click unsubscribe
      parameters:
        - { name: token, in: query, required: false, schema: { type: string } }
      responses:
        '200': { description: Unsubscribed }
        '422': { description: Invalid token }
  /me/ebooks:
    get: { tags: [Ebooks], summary: 'My ebooks: owned ebooks (orders paid/processing/shipped/delivered) with status, page_count, last_page, last_read_at, book card; most recently read first', responses: { '200': { description: Library } } }
  /me/ebook-devices:
    get: { tags: [Ebooks], summary: 'Browsers that read my ebooks (max 3). Send X-Reader-Device to get is_current. meta: max_devices, next_removal_at', responses: { '200': { description: Devices } } }
  /me/ebook-devices/{device}:
    delete: { tags: [Ebooks], summary: 'Remove a device (one removal per 30 days; 429 with the date otherwise)', parameters: [{ name: device, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Removed }, '429': { description: Too soon } } }
  /reader/{book}:
    get: { tags: [Ebooks], summary: 'Reader info: status (processing/ready/failed), page_count, preview_pages, owned, last_page. 404 when the book has no ebook', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Info } } }
  /reader/{book}/pages/{page}:
    get:
      tags: [Ebooks]
      summary: 'One page as a JPEG with the owner''s watermark (email + order number) burned in; Cache-Control no-store. Header X-Reader-Device (16-100 chars [A-Za-z0-9_-]) required: unknown devices are registered, max 3 (409). 403 not owned, 409 not ready, 120/min'
      parameters: [{ name: book, in: path, required: true, schema: { type: integer } }, { name: page, in: path, required: true, schema: { type: integer } }, { name: X-Reader-Device, in: header, required: true, schema: { type: string } }]
      responses: { '200': { description: Page image, content: { image/jpeg: { schema: { type: string, format: binary } } } }, '403': { description: Not owned }, '409': { description: Not ready or device limit } }
  /reader/{book}/progress:
    put: { tags: [Ebooks], summary: 'Save the reading position (page, clamped to the page count)', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], requestBody: { content: { application/json: { schema: { type: object, required: [page], properties: { page: { type: integer, minimum: 1 } } } } } }, responses: { '200': { description: Saved } } }
  /reader/{book}/preview:
    get: { tags: [Ebooks], summary: 'Free preview info (no account): page_count, preview_pages (staff value or 10%, at least 1). 404 when no ready ebook', security: [], parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Preview info } } }
  /reader/{book}/preview/pages/{page}:
    get: { tags: [Ebooks], summary: 'A preview page (JPEG, "Bookly · free preview" watermark); pages above preview_pages are 404', security: [], parameters: [{ name: book, in: path, required: true, schema: { type: integer } }, { name: page, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Page image } } }
  /staff/books/{book}/ebook:
    get: { tags: [Staff catalog], summary: 'The book''s ebook (status, page_count, pages_rendered, preview_pages, preview_limit, size_bytes, error) or null', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Ebook } } }
    post: { tags: [Staff catalog], summary: 'Upload the ebook PDF (multipart `file`, max 50 MB, must really be a PDF). Replaces an earlier one; pages are rendered in the background (ebooks:render)', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '201': { description: Uploaded }, '422': { description: Not a readable PDF } } }
    patch: { tags: [Staff catalog], summary: 'Set preview_pages (1..page_count, or null for 10%)', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Saved } } }
    delete: { tags: [Staff catalog], summary: 'Remove the ebook file and its pages', parameters: [{ name: book, in: path, required: true, schema: { type: integer } }], responses: { '204': { description: Removed } } }
  /staff/customers/{customer}/ebook-devices/reset:
    post: { tags: [Staff customers], summary: 'Free all of a customer''s ebook devices (and the 30-day wait)', parameters: [{ name: customer, in: path, required: true, schema: { type: integer } }], responses: { '200': { description: Reset } } }
  /cart-reminders/stop:
    post:
      tags: [Customer]
      summary: Stop cart reminder emails (the link in the email; no sign-in)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer, token]
              properties:
                customer: { type: integer }
                token: { type: string, maxLength: 100 }
      responses:
        '200': { description: Cart reminders turned off }
        '422': { description: Wrong link }
  /cart-reminders/stop/one-click:
    post:
      tags: [Customer]
      summary: RFC 8058 one-click version of the stop link (mail apps)
      security: []
      parameters:
        - { name: customer, in: query, required: true, schema: { type: integer } }
        - { name: token, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: Cart reminders turned off }
        '422': { description: Wrong link }
  /me/newsletter:
    get:
      tags: [Customer]
      summary: View customer newsletter subscription status
      responses:
        '200': { description: Subscription status }
    put:
      tags: [Customer]
      summary: Toggle newsletter subscription for verified customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subscribed]
              properties:
                subscribed: { type: boolean }
                locale: { type: string, enum: [en, km] }
      responses:
        '200': { description: Subscription updated }
        '403': { description: Unverified customer }
  /staff/newsletter/summary:
    get:
      tags: [Admin]
      summary: (admin) Summary counts of newsletter subscribers by status
      responses:
        '200': { description: Subscriber counts }
  /staff/newsletter/campaigns:
    get:
      tags: [Admin]
      summary: (admin) List newsletter campaigns
      description: 'Paginated, newest first. Each campaign has `status` (draft|sending|sent), `recipients_total` and `sent_count` (emails that have really gone out; the outbox sends at most MARKETING_DAILY_LIMIT a day). A campaign becomes `sent` when its last email has gone out.'
      responses:
        '200': { description: Campaigns list }
    post:
      tags: [Admin]
      summary: (admin) Create draft newsletter campaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_en, body_en]
              properties:
                subject_en: { type: string }
                subject_km: { type: string }
                body_en: { type: string }
                body_km: { type: string }
                book_ids: { type: array, items: { type: integer } }
      responses:
        '201': { description: Campaign created }
  /staff/newsletter/campaigns/{id}:
    get:
      tags: [Admin]
      summary: (admin) Show newsletter campaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Campaign details }
    put:
      tags: [Admin]
      summary: (admin) Update draft newsletter campaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_en, body_en]
              properties:
                subject_en: { type: string }
                subject_km: { type: string }
                body_en: { type: string }
                body_km: { type: string }
                book_ids: { type: array, items: { type: integer } }
      responses:
        '200': { description: Campaign updated }
        '422': { description: Not draft or validation failed }
    delete:
      tags: [Admin]
      summary: (admin) Delete draft newsletter campaign
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Campaign deleted }
        '422': { description: Not draft }
  /staff/newsletter/campaigns/{id}/test:
    post:
      tags: [Admin]
      summary: (admin) Send test newsletter to admin email
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Test email sent }
  /staff/newsletter/campaigns/{id}/send:
    post:
      tags: [Admin]
      summary: (admin) Send newsletter campaign to confirmed subscribers
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        '200': { description: Queued to outbox with estimated days }
        '422': { description: Not draft or already sent }
  /staff/health:
    get:
      tags: [Admin]
      summary: (admin) Detailed system health (database, queue, telegram bot, payments)
      responses:
        '200': { description: 'status ok or degraded; checks include database, queue, telegram_bot and payments ({mode: test|bakong, status: test|ok|unknown|token_missing|token_expired|token_expiring|token_invalid|blocked|unreachable|error, token_expires_at, last_check_at}; the token itself is never shown)' }
        '503': { description: 'status down (database unreachable)' }

