  /staff/offers:
    get: { tags: [Staff operations], summary: 'List automatic offers (q = name, status = live|scheduled|paused|ended|used_up|no_books, per_page). Staff with catalog:view and admins', responses: { '200': { description: 'Offers: all columns, status, targets [{type, id, label, in_trash}], orders_count' } } }
    post: { tags: [Staff operations], summary: '(admin) Create automatic offer', description: 'name, type buy_n_percent (default) or gift, applies_to all|selected, min_quantity 2-20 (gift 1-20, default 1), percent_off 0.01-50 (gift 0), gift_id required for gift, gift_quantity 1-100 default 1, min_subtotal optional positive matching subtotal instead of min_quantity for gifts, starts_at?, ends_at? after starts_at, max_orders?, is_active?, targets [{type book|category|series, id}] 1-200 for selected, refused for all. Gift and monetary winners are independent; one gift plus one monetary discount. Audited.', responses: { '201': { description: Created }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
  /staff/offers/{id}:
    get: { tags: [Staff operations], summary: 'One offer', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Offer } } }
    patch: { tags: [Staff operations], summary: '(admin) Update any field; pause/resume with is_active; targets replace the list when sent; switching to all drops them. used_count is read-only', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { $ref: '#/components/responses/Validation' } } }
    delete: { tags: [Staff operations], summary: '(admin) Delete if never used, else 409 (pause it instead)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { $ref: '#/components/responses/NoContent' }, '409': { description: Used on an order } } }
  /staff/media/upload:
    post:
      tags: [Staff catalog]
      summary: Upload and securely validate a media image (book cover, author photo)
      description: Validates file format (JPEG, PNG, WebP), magic bytes, dimensions (100x100 to 4000x4000), and file size (max 5 MB). Returns public URL and dimensions.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: Image file (max 5 MB) }
      responses:
        '201':
          description: Uploaded media
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedMedia'
        '422': { $ref: '#/components/responses/Validation' }
  /staff/orders:
    get: { tags: [Staff operations], summary: 'Orders (status, payment_method = cod|khqr, q = order number/customer, from, to); each order lists its payments (provider, status, amount, currency, reference, paid_at, how = bakong|test|staff, paid_after_cancel)', responses: { '200': { description: Orders } } }
  /staff/orders/bulk-status:
    post:
      tags: [Staff operations]
      summary: 'One status for up to 50 orders: processing, shipped or delivered (cancel stays one at a time). Each order changes on its own; the ones that cannot move are listed with the reason'
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids, status], properties: { ids: { type: array, items: { type: integer }, minItems: 1, maxItems: 50 }, status: { type: string, enum: [processing, shipped, delivered] }, note: { type: string, maxLength: 500, description: 'Added to each order timeline; the customer sees it' } } } } } }
      responses:
        '200':
          description: What changed and what did not
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: string }
                      updated: { type: array, items: { type: object, properties: { id: { type: integer }, order_number: { type: string }, status: { type: string } } } }
                      failed: { type: array, items: { type: object, properties: { id: { type: integer }, order_number: { type: string, nullable: true }, reason: { type: string } } } }
        '422': { $ref: '#/components/responses/Validation' }
  /staff/orders/documents:
    get:
      tags: [Staff operations]
      summary: 'Print data for invoices and packing slips, in the order asked (up to 50; unknown ids are left out)'
      parameters: [ { name: 'ids[]', in: query, required: true, schema: { type: array, items: { type: integer }, maxItems: 50 }, style: form, explode: true } ]
      responses: { '200': { description: One document per order, content: { application/json: { schema: { type: object, properties: { data: { type: array, items: { $ref: '#/components/schemas/OrderDocument' } } } } } } }, '422': { $ref: '#/components/responses/Validation' } }
  /staff/orders/{id}:
    get: { tags: [Staff operations], summary: 'Order with customer and allowed_next_statuses', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Order } } }
  /staff/orders/{id}/status:
    post: { tags: [Staff operations], summary: 'Move to processing, shipped, delivered or cancelled (with note)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Updated }, '422': { description: Not allowed by the flow } } }
  /staff/orders/{id}/mark-paid:
    post:
      tags: [Staff operations]
      summary: '(admin) Mark a KHQR order waiting for payment as paid, e.g. after seeing the money in the bank app. Note required; audit log'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [note], properties: { note: { type: string, minLength: 3, maxLength: 500 } } } } } }
      responses:
        '200': { description: 'Updated order (status paid, payments[].how = staff)' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { description: 'Not a KHQR order waiting for payment, or no note' }
  /staff/orders/{id}/staff-note:
    patch:
      tags: [Staff operations]
      summary: Update private staff note on an order
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                staff_note: { type: string, maxLength: 1000, nullable: true }
      responses:
        '200': { description: Updated order }
        '422': { $ref: '#/components/responses/Validation' }
  /staff/returns:
    get: { tags: [Staff operations], summary: 'Returns (status, q)', responses: { '200': { description: Returns } } }
  /staff/returns/{id}:
    get: { tags: [Staff operations], summary: 'One return', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Return } } }
  /staff/returns/{id}/approve:
    post: { tags: [Staff operations], summary: 'Approve (no stock change yet)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Approved } } }
  /staff/returns/{id}/reject:
    post: { tags: [Staff operations], summary: 'Reject (note required)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Rejected } } }
  /staff/returns/{id}/refund:
    post:
      tags: [Staff operations]
      summary: 'Mark refunded: books back in stock and the refund record saved (how, who, when)'
      description: 'store_credit makes a one-use fixed coupon CREDIT-XXXXXXXX for the refund amount, usable only by this customer, valid until 23:59:59 shop time on the same day 12 months later (for anyone else it answers like an unknown code).'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [method]
              properties:
                method: { type: string, enum: [cash, bank_transfer, store_credit] }
                reference: { type: string, maxLength: 100, description: 'Optional; only allowed for bank_transfer' }
                note: { type: string, maxLength: 1000 }
      responses: { '200': { description: Refunded } }
  /staff/reviews:
    get: { tags: [Staff operations], summary: 'Reviews (visible, book_id, max_rating, q)', responses: { '200': { description: Reviews } } }
  /staff/reviews/{id}/hide:
    post: { tags: [Staff operations], summary: 'Hide a review', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Hidden } } }
  /staff/reviews/{id}/show:
    post: { tags: [Staff operations], summary: 'Show a hidden review', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Visible } } }
  /staff/customers:
    get: { tags: [Staff operations], summary: 'Customers (q, active, verified, closed)', description: 'meta.counts {verified, unverified, closed} counts every tab with the same q filter (active applies to open accounts). Each unverified, active customer has removal_at: when the unfinished sign-up is deleted. closed=1 lists accounts the customers closed in the last CLOSED_ACCOUNT_DAYS (30), newest first, with closed_at and erase_at (when the details are erased).', responses: { '200': { description: Customers } } }
  /staff/customers/{id}:
    get: { tags: [Staff operations], summary: 'Customer with stats and recent orders (closed accounts too: closed_at, erase_at)', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: Customer } } }
    delete: { tags: [Admin], summary: '(admin) Delete an unfinished sign-up now, freeing its email', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '204': { description: Deleted }, '422': { description: 'Verified, or has orders, returns, reviews or addresses' } } }
  /staff/customers/{id}/reopen:
    post: { tags: [Admin], summary: '(admin) Reopen an account the customer closed, within its 30 days', description: 'Audit-logged as customer.reopened; the customer gets an email (when they have one) and signs in as before. Reviews, wishlist and cart removed at closing are not restored.', parameters: [ { $ref: '#/components/parameters/Id' } ], responses: { '200': { description: 'Reopened customer' }, '422': { description: 'The account is open, or was closed more than 30 days ago' } } }
  /staff/customers/{id}/close:
    post:
      tags: [Admin]
      summary: '(admin) Close customer account'
      description: 'Closes a customer account, revoking tokens and scheduling personal data erasure after 30 days. Requires admin password, 2FA code, and confirmation of email/phone.'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, code, confirm]
              properties:
                password: { type: string }
                code: { type: string }
                confirm: { type: string }
      responses:
        '200': { description: 'Closed customer' }
  /staff/customers/{id}/notes:
    get:
      tags: [Staff operations]
      summary: 'List customer notes'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '200': { description: Notes } }
    post:
      tags: [Staff operations]
      summary: 'Add note to customer'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, minLength: 1, maxLength: 2000 }
      responses: { '201': { description: Created } }
  /staff/customer-notes/{id}:
    delete:
      tags: [Staff operations]
      summary: 'Delete customer note (author or admin only)'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses: { '204': { description: Deleted }, '403': { description: Forbidden } }
  /staff/customers/{id}/tags:
    put:
      tags: [Staff operations]
      summary: 'Update customer tags (replaces set)'
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tags]
              properties:
                tags: { type: array, items: { type: string, maxLength: 40 }, maxItems: 10 }
      responses: { '200': { description: 'Updated tags' } }
  /staff/customer-tags:
    get:
      tags: [Staff operations]
      summary: 'Customer tag suggestions with customer count'
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses: { '200': { description: Tags } }
  /staff/customers/{id}/resend-verification:
    post:
